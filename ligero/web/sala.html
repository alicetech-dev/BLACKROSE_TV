<script type="module">
// Sala 3D de BlackRose TV (fuente Navegador de OBS, 1920×1080): Joy y Kuroki dentro de la pieza hacker o del cuarto de Joy.
// three.js LOCAL (/vendor): el navegador de OBS Flatpak no llega a los CDN. Los cuerpos llegan por los WebSockets de los
// overlays :8810 (Joy) y :8811 (Kuroki); las frases, por el director :8780. Ver ligero/sala.py.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { crearHacker } from '/mundo/hacker.js';
import { crearCuartoJoy } from '/sala/joy.js';
import { crearCanal } from '/sala/canal.js';

const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) && !isNaN(+P.get(k)) ? +P.get(k) : d);
const FPS = num('fps', 30), CAMX = P.get('cam') || 'auto', PLANO = num('plano', 18);
const HOST = location.hostname || '127.0.0.1';
let SALA = ['hacker', 'joy'].includes(P.get('sala')) ? P.get('sala') : 'hacker';
const SALA_FIJA = P.has('sala');
const dbg = document.getElementById('dbg'); if (P.has('debug')) dbg.style.display = 'block';

// ---------------------------------------------------------------- render
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = num('brillo', 1.0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060f);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 90);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ---------------------------------------------------------------- ayudas de los módulos del juego (como en resort.js)
const mat = (c, e = 0, ei = 1, extra = {}) => new THREE.MeshStandardMaterial({ color: c, emissive: e, emissiveIntensity: ei, roughness: 0.7, ...extra });
const neon = (c) => mat(0x000000, c, 1.6, { roughness: 1 });
const ubicar = (g, geo, m, x, y, z, ry = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.y = ry; g.add(o); return o; };
const caja = (g, w, h, d, m, x, y, z, ry) => ubicar(g, new THREE.BoxGeometry(w, h, d), m, x, y, z, ry);
const cil = (g, r1, r2, h, m, x, y, z, seg = 14) => ubicar(g, new THREE.CylinderGeometry(r1, r2, h, seg), m, x, y, z);
const lienzo = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return { c, g: c.getContext('2d'), tex }; };
function letrero(texto, w, h, col = '#ff4fb8', fuente = 'bold', fondo = null) {
  const px = 1024, { c, g, tex } = lienzo(px, Math.round(px * h / w));
  if (fondo) { g.fillStyle = fondo; g.fillRect(0, 0, c.width, c.height); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = col; g.fillStyle = '#fff';
  let tam = c.height * 0.7; g.font = `${fuente} ${tam}px system-ui`;
  while (g.measureText(texto).width > c.width * 0.92 && tam > 10) { tam *= 0.92; g.font = `${fuente} ${tam}px system-ui`; }
  for (const blur of [36, 16, 4]) { g.shadowBlur = blur; g.fillText(texto, c.width / 2, c.height / 2); }
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, depthWrite: false }));
}

// ---------------------------------------------------------------- los dos mundos
const canal = crearCanal();
const rig = new THREE.Group();
const H0 = { mat, neon, caja, cil, letrero, lienzo, rig, camera, scene, aviso() {}, fijar() {}, subtitulo() {}, conectar() {}, pintarMonitores: canal.pintarMonitores };
const hacker = crearHacker(H0), zH = { id: 'hacker', w: 16, d: 20, h: 4.2, origen: new THREE.Vector3() };
const gH = new THREE.Group(); scene.add(gH);
(function conchaHacker(g) {                       // lo que en el juego arma resort.js: piso de deck, paredes, techo y luces
  const W = 16, D = 20, H = 4.2;
  const cv = lienzo(512, 512); for (let i = 0; i < 16; i++) { cv.g.fillStyle = `hsl(25, 28%, ${17 + (i * 37 % 9)}%)`; cv.g.fillRect(0, i * 32, 512, 31); }
  cv.tex.wrapS = cv.tex.wrapT = THREE.RepeatWrapping; cv.tex.repeat.set(5, 6);
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshStandardMaterial({ map: cv.tex, roughness: 0.55 })); piso.rotation.x = -Math.PI / 2; g.add(piso);
  const pared = mat(0x3c3c52);
  caja(g, W, H, 0.2, pared, 0, H / 2, -D / 2); caja(g, W, H, 0.2, pared, 0, H / 2, D / 2); caja(g, 0.2, H, D, pared, -W / 2, H / 2, 0); caja(g, 0.2, H, D, pared, W / 2, H / 2, 0);
  caja(g, W, 0.12, D / 2 + 1, new THREE.MeshBasicMaterial({ color: 0x20202e }), 0, H, (D / 2 - 1) / 2 + 0.0);    // techo de la pieza (el jardín queda con cielo)
  caja(g, 0.06, 0.06, D / 2 + 1, neon(0xff4fb8), W / 2 - 0.3, H - 0.1, (D / 2 - 1) / 2); caja(g, 0.06, 0.06, D / 2 + 1, neon(0x39d0ff), -W / 2 + 0.3, H - 0.1, (D / 2 - 1) / 2);
  g.add(new THREE.HemisphereLight(0xa8b0e8, 0x3a2c34, 1.9));
  const a = new THREE.PointLight(0xffd0a8, 26, 18); a.position.set(0, 3.7, 3.5); g.add(a);
  const jd = new THREE.PointLight(0xb8c8ff, 22, 16); jd.position.set(0, 3.4, -5); g.add(jd);                       // el jardín de noche
  const b = new THREE.PointLight(0x39d0ff, 12, 10); b.position.set(-5.6, 2.8, 3); g.add(b);
  const c = new THREE.PointLight(0xff4fb8, 12, 10); c.position.set(5.2, 2.8, 4); g.add(c);
})(gH);
hacker.UT.hacker(zH, gH);
let joyRoom = null; const gJ = new THREE.Group(); scene.add(gJ);
joyRoom = crearCuartoJoy({ canal }); gJ.add(joyRoom.grupo);

// ---------------------------------------------------------------- planos de cámara y dónde se paran las dolls
// Cada plano trae su cámara y dónde se paran las dolls (se cambia de plano con un corte, así nadie ve que se mueven).
const SHOTS = {
  hacker: {
    jardin: { p: [0, 1.45, 3.4], l: [0, 1.25, -3.2], fov: 50, d: { joy: [-0.85, 0, 0.3], kuroki: [0.85, 0, 0.5] } },
    control: { p: [0.2, 1.5, 3.0], l: [-7.3, 1.35, 3.0], fov: 36, d: { joy: [-4.9, 0, 1.5], kuroki: [-4.9, 0, 4.5] } },
    sillon: { p: [0, 1.5, 0.2], l: [0, 1.15, 4.8], fov: 52, d: { joy: [-1.5, 0, 3.0], kuroki: [1.5, 0, 3.0] } },
  },
  joy: {
    amplio: { p: [1.0, 1.6, 3.6], l: [0.4, 1.1, -0.6], fov: 60, d: { joy: [0.35, 0, 0.0], kuroki: [1.75, 0, 0.3] } },
    tele: { p: [-2.6, 1.95, 3.7], l: [1.9, 1.1, 0.8], fov: 56, d: { joy: [1.0, 0, 0.9], kuroki: [2.1, 0, 1.7] } },
    tocador: { p: [1.9, 1.5, 3.1], l: [-1.4, 1.2, -1.3], fov: 56, d: { joy: [-0.2, 0, 0.4], kuroki: [1.0, 0, 0.7] } },
  },
};

// ---------------------------------------------------------------- las dolls (VRM + eco VMC por WebSocket)
const PRESET0 = { a: 'aa', i: 'ih', u: 'ou', e: 'ee', o: 'oh', joy: 'happy', sorrow: 'sad', fun: 'relaxed', angry: 'angry', blink: 'blink', blink_l: 'blinkLeft', blink_r: 'blinkRight', lookup: 'lookUp', lookdown: 'lookDown', lookleft: 'lookLeft', lookright: 'lookRight', neutral: 'neutral' };
const huesoVRM = (n) => n[0].toLowerCase() + n.slice(1);
const q = new THREE.Quaternion(), e = new THREE.Euler();
const REPOSO = { leftUpperArm: [0, 0, -1.15], rightUpperArm: [0, 0, 1.15], leftLowerArm: [0, 0, -0.12], rightLowerArm: [0, 0, 0.12], leftHand: [0, 0, -0.08], rightHand: [0, 0, 0.08] };
const dolls = {};
const ALTURA = num('altura', 1.70);
class Doll {
  constructor(id, url, wsUrl) {
    this.id = id; this.root = new THREE.Group(); this.root.visible = false; scene.add(this.root); this.vrm = null; this.exprs = {}; this.usadas = new Set();
    this.ultimo = 0; this.cadera0 = null; this.wsUrl = wsUrl; this.parpado = 3 + Math.random() * 3; this.yaw = 0; this.ok = false;
    new GLTFLoader().register((p) => new VRMLoaderPlugin(p)).loadAsync(url).then((gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene); (VRMUtils.combineSkeletons || VRMUtils.removeUnnecessaryJoints)?.(gltf.scene); VRMUtils.rotateVRM0(vrm);
      vrm.scene.traverse((o) => { o.frustumCulled = false; }); this.root.add(vrm.scene); this.vrm = vrm;
      for (const ex of vrm.expressionManager?.expressions ?? []) { this.exprs[ex.expressionName.toLowerCase()] = ex.expressionName; ex.overrideMouth = 'none'; }
      { vrm.scene.updateMatrixWorld(true); const bb = new THREE.Box3().setFromObject(vrm.scene, true), alto = bb.max.y - bb.min.y;   // las dos miden ALTURA m (1,70) sea cual sea el modelo
      if (alto > 0.5) { const k = ALTURA / alto; vrm.scene.scale.setScalar(k); vrm.scene.position.y = -bb.min.y * k; } }
      this.v0 = vrm.meta?.metaVersion === '0'; this.caderaRest = vrm.humanoid.getNormalizedBoneNode('hips').position.clone(); this.ok = true; this.root.visible = true;
    }).catch((err) => console.error('no pude cargar el VRM de', id, err));
    this.conectar();
  }
  conectar() {
    const ws = new WebSocket(this.wsUrl);
    ws.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (m.t === 'cuadro' && m.d) { this.ultimo = performance.now(); this.aplicar(m.d); } } catch (_) {} };
    ws.onclose = () => setTimeout(() => this.conectar(), 3000);
  }
  aplicar(d) {
    if (!this.ok) return; const vrm = this.vrm;
    for (const [n, r] of Object.entries(d.h || {})) {
      const nodo = vrm.humanoid.getNormalizedBoneNode(huesoVRM(n)); if (!nodo) continue;
      if (this.v0) q.set(-r[0], -r[1], r[2], r[3]); else q.set(r[0], -r[1], -r[2], r[3]);
      nodo.quaternion.slerp(q, 0.6);
    }
    if (d.c) {
      if (!this.cadera0) this.cadera0 = d.c;
      const mx = d.c[0] - this.cadera0[0], my = d.c[1] - this.cadera0[1], mz = d.c[2] - this.cadera0[2];
      vrm.humanoid.getNormalizedBoneNode('hips').position.set(this.caderaRest.x + (this.v0 ? mx : -mx), this.caderaRest.y + my, this.caderaRest.z + (this.v0 ? -mz : mz));
    }
    const em = vrm.expressionManager; if (!em) return; const vistas = new Set();
    for (const [n, v] of Object.entries(d.b || {})) {
      const k = n.toLowerCase(), nom = this.exprs[k] || this.exprs[(PRESET0[k] || '').toLowerCase()];
      if (nom) { em.setValue(nom, v); vistas.add(nom); this.usadas.add(nom); }
    }
    for (const nom of this.usadas) if (!vistas.has(nom)) em.setValue(nom, 0);
  }
  tick(dt, t) {
    if (!this.ok) return; const vrm = this.vrm;
    if (performance.now() - this.ultimo > 1500) {                  // sin VMC (stack parado): brazos abajo, respira y parpadea
      for (const [n, r] of Object.entries(REPOSO)) { const nodo = vrm.humanoid.getNormalizedBoneNode(n); if (nodo) nodo.quaternion.slerp(q.setFromEuler(e.set(r[0], r[1], r[2])), Math.min(1, dt * 3)); }
      const sp = vrm.humanoid.getNormalizedBoneNode('spine'); if (sp) sp.rotation.x = Math.sin(t * 1.3) * 0.012;
      const hips = vrm.humanoid.getNormalizedBoneNode('hips'); hips.position.lerp(this.caderaRest, Math.min(1, dt * 3));
      const em = vrm.expressionManager; if (em) { this.parpado -= dt; const nom = this.exprs.blink; if (nom) em.setValue(nom, this.parpado < 0 && this.parpado > -0.15 ? 1 : 0); if (this.parpado < -0.15) this.parpado = 2.5 + Math.random() * 4; }
    }
    vrm.update(dt);
  }
}
dolls.joy = new Doll('joy', '/joy.vrm', `ws://${HOST}:8810/ws`);
dolls.kuroki = new Doll('kuroki', '/kuroki.vrm', `ws://${HOST}:8811/ws`);

// ---------------------------------------------------------------- quién habla (director :8780): la cámara se acerca
let habla = null, hablaHasta = 0;
(function director() {
  const ws = new WebSocket(P.get('director') || `ws://${HOST}:8780/ws`);
  ws.onmessage = (m) => { try { const d = JSON.parse(m.data); if (!dolls[d.doll]) return;
    if (d.type === 'frase') { habla = d.doll; hablaHasta = performance.now() + 60000; } else if (d.type === 'fin' && habla === d.doll) hablaHasta = performance.now() + 2500; } catch (_) {} };
  ws.onclose = () => setTimeout(director, 3000);
})();

// ---------------------------------------------------------------- cambiar de entorno (a mano con ?sala= o por POST /api/sala)
function aplicarSala(s) { SALA = s; shotAct = null; idx = 0; planoT = PLANO; }
if (!SALA_FIJA) setInterval(async () => { try { const d = await (await fetch('/api/sala', { cache: 'no-store' })).json(); if (d.sala && d.sala !== SALA) aplicarSala(d.sala); ponerMedio(d.medio); } catch (_) {} }, 2000);

let medioAct = null;
function ponerMedio(m) {                       // foto/nota que manda el director (noticias con foto, tus videos, tendencias, ayuda)
  if (m && m.clase === 'sueno') { cctvForzar(m.seg || 60); m = null; }                 // las cámaras de seguridad: las pide el director
  const el = document.getElementById('medio'), k = m ? (m.titulo || '') + '|' + (m.img || '') : null; if (k === medioAct) return; medioAct = k;
  if (!m) { el.style.display = 'none'; return; }
  document.getElementById('mK').textContent = ({ noticia: 'NOTICIA · CON FOTO', video: 'NUEVO VIDEO DE ALICE', tendencia: 'TENDENCIA', ayuda: 'AYÚDANOS A SEGUIR AL AIRE' })[m.clase] || 'BLACKROSE TV';
  const im = document.getElementById('mI'); im.style.display = m.img ? 'block' : 'none'; if (m.img) im.src = m.img;
  document.getElementById('mT').textContent = m.titulo || ''; document.getElementById('mC').textContent = m.credito || ''; el.style.display = 'block';
}
// ---------------------------------------------------------------- cámara: planos que rotan, y primer plano de quien habla
const camPos = new THREE.Vector3(0, 1.6, 6), camLook = new THREE.Vector3(0, 1.2, 0); let camFov = 50, idx = 0, planoT = 0, corte = true, shotAct = null;
const v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
function primerPlano(id, sh) {
  const d = dolls[id].root.position; v1.set(sh.p[0] - d.x, 0, sh.p[2] - d.z).normalize();
  v2.set(-v1.z, 0, v1.x).multiplyScalar(0.35);
  return { p: [d.x + v1.x * 2.0 + v2.x, 1.42, d.z + v1.z * 2.0 + v2.z], l: [d.x, 1.3, d.z], fov: 32 };
}
function camara(dt, t) {
  if (cctv.on) {                                   // cámara de seguridad: fija, sin suavizado
    const c = CAMS[cctv.cam]; camera.position.set(c.p[0] + Math.sin(t * 0.3) * 0.04, c.p[1], c.p[2]); camera.lookAt(c.l[0], c.l[1], c.l[2]);
    if (camera.fov !== c.fov) { camera.fov = c.fov; camera.updateProjectionMatrix(); } camFov = c.fov; camPos.set(...c.p); camLook.set(...c.l); return;
  }
  const lista = SHOTS[SALA], nombres = Object.keys(lista);
  const sigue = CAMX === 'joy' || CAMX === 'kuroki' ? CAMX : (CAMX === 'auto' && habla && performance.now() < hablaHasta ? habla : null);
  if (!sigue && !lista[CAMX]) { planoT -= dt; if (planoT <= 0) { planoT = PLANO; idx = (idx + 1) % nombres.length; } }   // mientras alguien habla no se cambia de plano
  const base = (medioAct && CAMX === 'auto' && (lista.control || lista.tele)) || lista[CAMX] || lista[nombres[idx]] || lista[nombres[0]];
  if (base !== shotAct) { shotAct = base; corte = true; for (const id of Object.keys(dolls)) dolls[id].root.position.set(...base.d[id]); }
  const sh = sigue ? primerPlano(sigue, base) : base;
  const k = corte ? 1 : 1 - Math.exp(-dt * 1.7); corte = false;
  camPos.lerp(v1.set(...sh.p), k); camLook.lerp(v2.set(...sh.l), k); camFov += (sh.fov - camFov) * k;
  camera.position.set(camPos.x + Math.sin(t * 0.21) * 0.16, camPos.y + Math.sin(t * 0.17) * 0.03, camPos.z + Math.cos(t * 0.15) * 0.1);
  camera.lookAt(camLook); if (Math.abs(camera.fov - camFov) > 0.01) { camera.fov = camFov; camera.updateProjectionMatrix(); }
}
const angulo = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// ---------------------------------------------------------------- Alice duerme: cuenta regresiva + cámara de circuito cerrado
// POST :8830/api/sueno ({"minutos":180} / {"hasta":"07:30"}) o ./tv.sh dormir. Mientras duerme: insignia con la cuenta regresiva,
// su avatar en la cama (tapado hasta el cuello) y, cada ?cctv= segundos, un corte de ?cctvdur= s a las cámaras de seguridad.
let sueno = { dormida: false, despierta: 0 }, offT = 0, durmiente = null;
const restante = () => Math.max(0, sueno.despierta - (Date.now() + offT) / 1000);
const dormida = () => sueno.dormida && restante() > 0;
canal.setSueno(dormida, restante);
const hms = (sg) => { sg = Math.max(0, Math.floor(sg)); return [Math.floor(sg / 3600), Math.floor(sg / 60) % 60, sg % 60].map((n) => String(n).padStart(2, '0')).join(':'); };
class Durmiente {
  constructor() {
    this.root = new THREE.Group(); this.root.visible = false; scene.add(this.root); this.ok = false; this.blink = 'blink';
    new GLTFLoader().register((p) => new VRMLoaderPlugin(p)).loadAsync('/yo.vrm').then((gltf) => {
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene); (VRMUtils.combineSkeletons || VRMUtils.removeUnnecessaryJoints)?.(gltf.scene); VRMUtils.rotateVRM0(vrm);
