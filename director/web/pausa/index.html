<script>
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);

// ────────── visuales (zona derecha: centro ~ (1400, 470)) ──────────
const CX = 1400, CY = 470, V = {};

  for (let i = 0; i < 5; i++) { const p = ((t * .5 + i / 5) % 1); g.globalAlpha = (1 - p) * .8; g.beginPath(); g.arc(0, 0, 60 + p * 360, 0, 7); g.stroke(); }

  g.restore(); g.save(); g.fillStyle = '#fff'; g.font = '170px Monoton'; g.textAlign = 'center'; g.fillText('BR', CX, CY + 60); g.restore();
};
let pistas = null;
V.chip = (t) => {
  if (!pistas) { pistas = []; for (let i = 0; i < 46; i++) { let x = rnd(820, 1900), y = rnd(100, 980); const pts = [[x, y]];
      for (let k = 0; k < 5; k++) { if (k % 2) y += rnd(-160, 160); else x += rnd(-200, 200); pts.push([x, y]); } pistas.push({ pts, v: rnd(.1, .35), o: Math.random() }); } }
  g.save(); g.lineWidth = 3;
  for (const p of pistas) { g.strokeStyle = ac; g.globalAlpha = .22; g.beginPath(); p.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    const u = ((t * p.v + p.o) % 1) * (p.pts.length - 1), i = Math.floor(u), f = u - i, a = p.pts[i], b = p.pts[Math.min(i + 1, p.pts.length - 1)];
    g.globalAlpha = 1; g.fillStyle = '#fff'; g.beginPath(); g.arc(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, 6, 0, 7); g.fill(); }
  g.restore(); g.save(); g.translate(CX, CY); g.strokeStyle = ac; g.lineWidth = 5; g.fillStyle = 'rgba(5,3,12,.92)';
  g.fillRect(-150, -150, 300, 300); g.strokeRect(-150, -150, 300, 300); g.lineWidth = 3;
  for (let i = -4; i <= 4; i++) for (const s of [-1, 1]) { g.beginPath(); g.moveTo(i * 30, s * 150); g.lineTo(i * 30, s * 195); g.stroke(); g.beginPath(); g.moveTo(s * 150, i * 30); g.lineTo(s * 195, i * 30); g.stroke(); }
  g.strokeRect(-80, -80, 160, 160); g.font = '56px Orbitron'; g.fillStyle = ac; g.textAlign = 'center'; g.fillText('CPU', 0, 20); g.globalAlpha = .5 + .5 * Math.sin(t * 4); g.fillRect(-60, 50, 120, 6); g.restore();
};
V.mando = (t) => {
  const P = 18, M = ['....XXXXXXXXXXXXXXXX....', '..XXXXXXXXXXXXXXXXXXXX..', '.XXXXXXXXXXXXXXXXXXXXXX.', 'XXXX.XXXXXXXXXXXXXX.XXXX', 'XXX.D.XXXXXXXXXXXA.B.XXX', 'XXXDDDXXXXXXXXXXXXAXAXXX', 'XXX.D.XXXXXXXXXXXXXCXXXX',

    g.fillStyle = ac; g.globalAlpha = v; g.beginPath(); g.arc(n[0], n[1], 14, 0, 7); g.fill(); }));

  const R = 300, pr = (lat, lon, rot) => { const la = lat * Math.PI / 180, lo = lon * Math.PI / 180 + rot; return [CX + R * Math.cos(la) * Math.sin(lo), CY - R * Math.sin(la), Math.cos(la) * Math.cos(lo)]; };
  g.save(); g.strokeStyle = ac; g.lineWidth = 2; const rot = t * .35;
