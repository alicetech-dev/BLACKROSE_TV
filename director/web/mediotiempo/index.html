<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>BlackRose TV · Show de Medio Tiempo</title>
<!-- SHOW DE MEDIO TIEMPO de BlackRose TV, 1920×1080. Dos capas (misma página, se sincronizan por GET /api/mediotiempo):
       ?capa=fondo  escenario opaco, va DEBAJO de las dolls en OBS
       ?capa=frente transparente en la parte A (programación, revolución, suscríbete) y opaca en la tanda comercial 2049
       (sin ?capa = las dos juntas, para mirar en un navegador)
     Parte A la guía el servidor (las dolls hablan por el director). Parte B = tanda de 10:00 con audio de guion.json (generar.py).
     ?mudo=1 sin audio · ?musica=0.12 (cama de fondo; por defecto 0 = solo voz) · ?demo=A:prog2 (pantalla fija) · ?demo=B:200 (segundo 200 de la tanda) · ?demo=A:inicio ... -->
<style>
@font-face{font-family:Monoton;src:url(/img/fuentes/monoton.woff2) format("woff2")}
@font-face{font-family:Audiowide;src:url(/img/fuentes/audiowide.woff2) format("woff2")}
@font-face{font-family:Orbitron;src:url(/img/fuentes/orbitron.woff2) format("woff2")}
@font-face{font-family:Rajdhani;src:url(/img/fuentes/rajdhani700.woff2) format("woff2");font-weight:700}
@font-face{font-family:VT323;src:url(/img/fuentes/vt323.woff2) format("woff2")}
:root{--rosa:#ff2fd6;--cian:#00e5ff;--rojo:#ff3b3b;--ama:#ffe45e;--c:#ff2fd6;--c2:#00e5ff}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:#fff;font-family:Rajdhani,sans-serif}
#fondo,#frente{position:absolute;inset:0}
body[data-capa=fondo] #frente,body[data-capa=frente] #fondo{display:none}
body[data-capa=fondo],body[data-capa=todo]{background:#05030c}
body[data-fase=B] #fondo,body[data-fase=fin] #fondo{display:none}
body[data-fase=B]:not([data-capa=frente]),body[data-fase=fin]:not([data-capa=frente]){background:#05030c}
@keyframes late{50%{opacity:.35}}
@keyframes subeTxt{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(3)}60%{opacity:1;transform:scale(.93)}100%{transform:scale(1)}}
@keyframes ent{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}70%{transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes flota{50%{transform:translateY(-12px)}}
@keyframes gira{to{transform:rotate(360deg)}}

/* ═══════════ FONDO: el escenario ═══════════ */
#fondo{overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#2b0a3d 0,#12031f 45%,#05030c 85%)}
#fondo .rayo{position:absolute;left:50%;top:-260px;width:2600px;height:2600px;margin-left:-1300px;opacity:.5;mix-blend-mode:screen;
  background:conic-gradient(from 0deg,transparent 0 8deg,rgba(255,47,214,.55) 10deg,transparent 14deg 52deg,rgba(0,229,255,.5) 54deg,transparent 58deg 96deg,rgba(255,228,94,.4) 98deg,transparent 102deg 140deg,rgba(180,107,255,.5) 142deg,transparent 146deg 360deg);
  animation:gira 38s linear infinite}
#fondo .rayo.b{opacity:.35;animation-duration:61s;animation-direction:reverse;transform:scale(.8)}
#fondo .piso{position:absolute;left:-40%;right:-40%;bottom:-8%;height:46%;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%;
  background:linear-gradient(rgba(255,47,214,.75) 2px,transparent 2px) 0 0/100% 60px,linear-gradient(90deg,rgba(0,229,255,.6) 2px,transparent 2px) 0 0/80px 100%;
  animation:avanza 2.4s linear infinite;mask-image:linear-gradient(transparent,#000 40%)}
@keyframes avanza{to{background-position:0 60px,0 0}}
#fondo .horizonte{position:absolute;left:0;right:0;top:56%;height:6px;background:linear-gradient(90deg,transparent,#ff2fd6,#00e5ff,#ff2fd6,transparent);box-shadow:0 0 40px 6px rgba(255,47,214,.6)}
#fondo canvas{position:absolute;left:0;bottom:0}
#fondo .letrero{position:absolute;left:0;right:0;top:600px;text-align:center;font-family:Monoton;font-size:84px;letter-spacing:12px;color:#fff;
  text-shadow:0 0 6px #fff,0 0 26px var(--rosa),0 0 70px var(--rosa);animation:zumbido 7s infinite}
@keyframes zumbido{0%,92%,100%{opacity:1}93%{opacity:.5}94%{opacity:1}96%{opacity:.7}}
#fondo .truss{position:absolute;left:0;right:0;top:0;height:20px;background:repeating-linear-gradient(90deg,#2a2335 0 40px,#17121f 40px 44px);box-shadow:0 6px 18px #000}
#fondo .foco{position:absolute;top:10px;width:46px;height:46px;border-radius:50%;background:radial-gradient(#fff,var(--fc));box-shadow:0 0 30px 8px var(--fc);animation:late 1.8s infinite}

/* ═══════════ FRENTE · parte A ═══════════ */
#A{position:absolute;inset:0}
#cab{position:absolute;left:44px;top:34px;display:flex;align-items:center;gap:16px;z-index:5;filter:drop-shadow(0 0 10px rgba(255,47,214,.6))}
#cab .br{font-family:Monoton;font-size:44px;letter-spacing:2px;text-shadow:0 0 6px #fff,0 0 20px var(--rosa)}
#cab .tv{font-family:Audiowide;font-size:25px;padding:0 10px 2px;border:3px solid var(--cian);color:var(--cian);border-radius:7px;text-shadow:0 0 8px var(--cian)}
#cab .vivo{font-family:Orbitron;font-size:17px;letter-spacing:3px;background:var(--rojo);padding:6px 11px 4px;border-radius:4px;box-shadow:0 0 14px rgba(255,59,59,.8)}
#cab .vivo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:8px;animation:late 1.2s infinite}
#cab .show{font-family:Audiowide;font-size:23px;letter-spacing:7px;color:#09020f;background:var(--ama);padding:6px 16px 4px;transform:skewX(-8deg);box-shadow:0 0 18px rgba(255,228,94,.6)}
#pie{position:absolute;left:0;right:0;bottom:0;height:54px;background:rgba(8,2,14,.9);border-top:3px solid var(--rosa);display:flex;align-items:center;overflow:hidden;z-index:5;font-family:Orbitron;font-size:21px;letter-spacing:3px}
#pie .et{position:relative;z-index:2;background:var(--rosa);color:#09020f;height:100%;padding:0 22px;display:flex;align-items:center;white-space:nowrap}
#pie .corre{display:inline-flex;white-space:nowrap;animation:corre 46s linear infinite;color:#e9d9f7}
#pie .corre b{color:var(--ama);font-weight:400;margin:0 14px}
@keyframes corre{to{transform:translateX(-50%)}}
.panel{position:absolute;left:440px;top:150px;width:1040px;background:rgba(10,3,20,.8);border:3px solid var(--c);
  box-shadow:0 0 36px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 40px rgba(0,0,0,.5);padding:26px 34px 30px;backdrop-filter:blur(3px);animation:subeTxt .7s both}
.panel .k{font-family:Orbitron;font-size:22px;letter-spacing:7px;color:var(--c2);text-shadow:0 0 10px var(--c2)}
.panel h2{margin:8px 0 18px;font-family:Audiowide;font-size:58px;font-weight:400;letter-spacing:3px;color:#fff;text-shadow:0 0 22px var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{display:flex;align-items:center;gap:18px;padding:16px 20px 14px;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 35%,#0a0314),#0a0314 85%);
  border-left:8px solid var(--tc);box-shadow:0 0 18px color-mix(in srgb,var(--tc) 45%,transparent);opacity:0;animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i) * 1.4s + .5s)}
.tile .ic{font-size:50px;line-height:1;min-width:64px;text-align:center;filter:drop-shadow(0 0 8px var(--tc))}
.tile b{display:block;font-family:Audiowide;font-weight:400;font-size:33px;line-height:1.05;letter-spacing:1px;color:#fff;text-shadow:0 0 12px var(--tc)}
.tile small{font-family:Rajdhani;font-size:22px;letter-spacing:2px;color:var(--tc);text-transform:uppercase}
.puntos{display:flex;gap:10px;margin-top:18px;justify-content:center}
.puntos i{width:60px;height:8px;background:#3a2a4d;border-radius:4px}.puntos i.on{background:var(--c);box-shadow:0 0 14px var(--c)}
/* inicio */
.gran{position:absolute;left:0;right:0;top:230px;text-align:center}
.gran .pre{font-family:Audiowide;font-size:38px;letter-spacing:14px;color:var(--cian);text-shadow:0 0 14px var(--cian);animation:subeTxt .8s .3s both}
.gran .nom{font-family:Monoton;font-size:210px;line-height:1.05;color:#fff;text-shadow:0 0 8px #fff,0 0 30px var(--rosa),0 0 80px var(--rosa);animation:slam .7s .5s both}
.gran .sub{font-family:Audiowide;font-size:42px;letter-spacing:9px;color:var(--ama);text-shadow:0 0 14px #ffb627;animation:subeTxt .8s 1.1s both}
.conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.conf i{position:absolute;top:-30px;width:14px;height:24px;animation:cae linear infinite}
@keyframes cae{to{transform:translateY(1150px) rotate(720deg)}}
/* revolución */
.linea{position:relative;display:flex;justify-content:space-between;margin:34px 0 8px}
.linea::before{content:"";position:absolute;left:50px;right:50px;top:44px;height:6px;background:#2d1f40;border-radius:3px}
.linea::after{content:"";position:absolute;left:50px;top:44px;height:6px;width:0;background:linear-gradient(90deg,var(--cian),var(--rosa),var(--ama));box-shadow:0 0 16px var(--rosa);border-radius:3px;animation:llena 33s linear .5s forwards}
@keyframes llena{to{width:calc(100% - 100px)}}
.nodo{position:relative;z-index:1;width:140px;text-align:center;opacity:.25;animation:enciende .6s forwards;animation-delay:calc(var(--i) * 6.2s + .4s)}
.nodo .o{width:94px;height:94px;margin:0 auto 10px;border-radius:50%;background:#0a0314;border:5px solid var(--nc);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 0 20px color-mix(in srgb,var(--nc) 55%,transparent)}
.nodo b{display:block;font-family:Audiowide;font-weight:400;font-size:23px;letter-spacing:1px;color:#fff}
.nodo small{font-family:VT323;font-size:30px;color:var(--nc)}
.nodo.ultimo .o{width:110px;height:110px;margin-top:-8px;font-size:52px;animation:latido 1.3s infinite}
@keyframes enciende{to{opacity:1}}
@keyframes latido{50%{transform:scale(1.1);box-shadow:0 0 50px var(--nc)}}
.lemas{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.lemas span{font-family:Orbitron;font-size:21px;letter-spacing:3px;padding:8px 16px 6px;color:#09020f;background:var(--ama);box-shadow:0 0 14px rgba(255,228,94,.5);opacity:0;animation:pop .5s forwards}
.lemas span{font-size:19px}.lemas span:nth-child(1){animation-delay:12s}.lemas span:nth-child(2){animation-delay:22s;background:var(--cian)}.lemas span:nth-child(3){animation-delay:32s;background:var(--rosa);color:#fff}
/* suscríbete */
.sus{position:absolute;left:0;right:0;top:170px;text-align:center}
.sus .t{font-family:Audiowide;font-size:36px;letter-spacing:10px;color:var(--cian);text-shadow:0 0 14px var(--cian);animation:subeTxt .7s both}
.boton{display:inline-flex;align-items:center;gap:26px;margin:22px 0 10px;padding:22px 64px 18px 40px;font-family:Orbitron;font-weight:900;font-size:104px;letter-spacing:6px;color:#fff;
  background:linear-gradient(180deg,#ff4a4a,#c40d0d);border-radius:22px;box-shadow:0 0 0 8px #fff,0 0 60px #ff3b3b,0 12px 0 #7a0000;animation:slam .7s .3s both,presiona 2.4s 2s infinite}
.boton svg{width:112px;height:80px}
@keyframes presiona{0%,70%,100%{transform:none}78%{transform:translateY(10px) scale(.97);box-shadow:0 0 0 8px #fff,0 0 60px #ff3b3b,0 2px 0 #7a0000}}
.campana{display:inline-block;font-size:90px;vertical-align:middle;margin-left:30px;transform-origin:50% 8%;animation:campana 1.2s 2.8s infinite}
@keyframes campana{0%,100%{transform:rotate(0)}15%{transform:rotate(22deg)}30%{transform:rotate(-20deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}}
.sus .redes{display:flex;gap:30px;justify-content:center;margin-top:24px}
.sus .redes div{font-family:Audiowide;font-size:34px;letter-spacing:3px;padding:12px 28px 10px;border:3px solid var(--rosa);background:rgba(10,3,20,.85);box-shadow:0 0 20px rgba(255,47,214,.5);animation:subeTxt .7s 1.2s both}
.sus .redes div:nth-child(2){border-color:var(--cian);box-shadow:0 0 20px rgba(0,229,255,.5);animation-delay:1.5s}
.sus .redes small{display:block;font-family:Rajdhani;font-size:24px;letter-spacing:3px;color:var(--ama)}
.sus .pie{margin-top:22px;font-family:VT323;font-size:42px;color:#ffd1f6;letter-spacing:3px;text-shadow:0 0 10px var(--rosa);animation:subeTxt .7s 2s both}
/* tanda */
.tanda{position:absolute;left:0;right:0;top:170px;text-align:center}
.tanda .t1{font-family:Audiowide;font-size:36px;letter-spacing:10px;color:var(--cian);text-shadow:0 0 14px var(--cian);animation:subeTxt .7s both}
.tanda .t2{font-family:Monoton;font-size:150px;color:#fff;line-height:1.1;text-shadow:0 0 8px #fff,0 0 30px var(--ama),0 0 70px #ffb627;animation:slam .7s .3s both}
.tanda .t3{font-family:VT323;font-size:150px;line-height:1;color:var(--ama);text-shadow:0 0 22px #ffb627;animation:subeTxt .7s .9s both}
.tanda .marcas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:1300px;margin:18px auto 0}
.tanda .marcas span{font-family:Orbitron;font-weight:900;font-size:24px;letter-spacing:3px;padding:8px 16px 6px;border:2px solid var(--mc);color:var(--mc);background:rgba(10,3,20,.85);opacity:0;animation:pop .45s forwards;animation-delay:calc(var(--i) * .5s + 1.4s)}

/* ═══════════ FRENTE · parte B: tanda comercial 2049 ═══════════ */
#B{position:absolute;inset:0;background:#06030d;display:none;overflow:hidden}
body[data-fase=B] #B,body[data-fase=fin] #B{display:block}
body[data-fase=B] #A,body[data-fase=fin] #A{display:none}
#B .sol{position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;opacity:.55;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 70%,#000) 0 6deg,#0b0414 6deg 12deg);animation:gira 90s linear infinite}
#B .vel{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,3,13,.55) 0,rgba(6,3,13,.9) 80%)}
#B .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
#bTop{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;background:linear-gradient(rgba(6,3,13,.96),rgba(6,3,13,.6));z-index:6;border-bottom:3px solid var(--c)}
#bTop .izq{display:flex;align-items:center;gap:16px}
#bTop .br{font-family:Monoton;font-size:40px;text-shadow:0 0 6px #fff,0 0 20px var(--rosa)}
#bTop .tag{font-family:Orbitron;font-size:22px;letter-spacing:6px;background:var(--ama);color:#09020f;padding:7px 16px 5px;transform:skewX(-8deg)}
#bTop .anio{font-family:VT323;font-size:44px;color:var(--cian);letter-spacing:4px;text-shadow:0 0 10px var(--cian)}
#bTop .der{text-align:right;line-height:1}
#bTop .der small{display:block;font-family:Orbitron;font-size:15px;letter-spacing:5px;color:#cdb8df}
#bTop .der b{font-family:VT323;font-weight:400;font-size:64px;color:var(--ama);text-shadow:0 0 14px #ffb627}
#bBarra{position:absolute;left:0;top:92px;height:6px;width:0;background:linear-gradient(90deg,var(--cian),var(--rosa),var(--ama));box-shadow:0 0 14px var(--rosa);z-index:6}
#bBolsa{position:absolute;left:0;right:0;bottom:46px;height:52px;background:rgba(8,2,14,.92);border-top:3px solid var(--c);display:flex;align-items:center;overflow:hidden;z-index:6;font-size:28px}
#bBolsa .et{background:var(--c);color:#09020f;font-family:Orbitron;font-size:17px;letter-spacing:4px;height:100%;padding:0 18px;display:flex;align-items:center;white-space:nowrap;z-index:1}
#bBolsa .corre{display:inline-flex;white-space:nowrap;animation:corre 60s linear infinite}
#bBolsa .it{margin-right:36px}.it i{font-style:normal;margin-left:8px;color:#cdb8df}.sube{color:#3dff9a!important}.baja{color:#ff4d6d!important}
#bAviso{position:absolute;left:0;right:0;bottom:0;height:46px;background:#09020f;display:flex;align-items:center;justify-content:center;gap:30px;z-index:6;font-family:VT323;font-size:28px;letter-spacing:4px;color:#fff;border-top:2px solid #3a2a4d}
#bAviso b{font-weight:400;color:var(--ama)}
.esc{position:absolute;left:0;top:98px;width:1920px;height:884px;display:none}
.esc.on{display:block}
/* spot */
.marca-corp{position:absolute;left:70px;top:34px}
.marca-corp .rub{font-family:Orbitron;font-size:21px;letter-spacing:6px;color:var(--c2);text-shadow:0 0 10px var(--c2);animation:ent .5s both}
.marca-corp .cor{font-family:Audiowide;font-size:82px;line-height:1.05;color:#fff;letter-spacing:4px;text-shadow:5px 5px 0 var(--c),0 0 26px var(--c);animation:ent .6s .1s both}
.prod{position:absolute;left:70px;top:185px;width:1020px}
.prod .n{font-family:Monoton;font-size:138px;line-height:1;color:#fff;text-shadow:0 0 8px #fff,0 0 30px var(--c),0 0 70px var(--c);animation:slam .65s .3s both;word-break:break-word}
.prod .s{margin-top:12px;font-family:Audiowide;font-size:44px;letter-spacing:3px;text-transform:uppercase;color:#09020f;animation:subeTxt .6s .9s both}
.prod .s b{display:inline-block;font-weight:400;background:var(--c2);padding:6px 20px 4px;box-shadow:6px 6px 0 #09020f,0 0 24px var(--c2)}
.arte{position:absolute;right:60px;top:20px;width:800px;height:800px;animation:pop .8s .5s both}
.arte svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 70%,transparent))}
.peg{position:absolute;left:70px;bottom:120px;width:980px;min-height:130px;display:flex;align-items:center}
.peg div{font-family:Audiowide;font-size:50px;line-height:1.08;letter-spacing:1px;text-transform:uppercase;color:#09020f;background:#fff;padding:16px 28px 12px;transform:rotate(-2deg);
  box-shadow:0 0 0 5px #09020f,10px 10px 0 5px var(--c);animation:slam .45s both}
.tel{position:absolute;left:70px;bottom:46px;display:flex;align-items:center;gap:18px;animation:subeTxt .6s 1.4s both}
.tel .l{font-family:Orbitron;font-weight:900;font-size:26px;letter-spacing:5px;background:var(--rojo);padding:10px 18px 8px;box-shadow:0 0 18px rgba(255,59,59,.7);animation:late 1.2s infinite}
.tel .n{font-family:VT323;font-size:64px;letter-spacing:5px;color:var(--ama);text-shadow:0 0 14px #ffb627}
.precio{position:absolute;right:130px;bottom:20px;width:440px;height:440px;display:none;align-items:center;justify-content:center;text-align:center;padding:0 90px;
  font-family:Audiowide;font-size:44px;line-height:1.05;color:#09020f;background:var(--ama);transform:rotate(-8deg);
  clip-path:polygon(50% 0,61% 14%,79% 8%,80% 27%,98% 31%,88% 48%,100% 62%,83% 70%,84% 88%,66% 84%,50% 100%,36% 85%,18% 90%,18% 71%,0 62%,12% 47%,2% 30%,21% 26%,21% 9%,40% 14%)}

.legal{position:absolute;left:0;right:0;bottom:0;height:40px;background:rgba(0,0,0,.78);overflow:hidden;display:flex;align-items:center}
.legal span{white-space:nowrap;font-family:VT323;font-size:27px;color:#c9bbd6;letter-spacing:1px;padding-left:100%;animation:legal 40s linear infinite}
@keyframes legal{to{transform:translateX(-100%)}}
.n8{position:absolute;right:60px;top:10px;font-family:Orbitron;font-size:20px;letter-spacing:5px;color:#09020f;background:var(--c2);padding:6px 14px 4px;z-index:2;box-shadow:0 0 16px var(--c2)}
/* sting */
.st{position:absolute;inset:0;text-align:center}
.st .a{position:absolute;left:0;right:0;top:80px;font-family:Audiowide;font-size:38px;letter-spacing:14px;color:var(--c2);text-shadow:0 0 14px var(--c2);animation:subeTxt .6s both}
.st .b{position:absolute;left:0;right:0;top:150px;font-family:Audiowide;font-size:98px;letter-spacing:6px;color:#fff;text-shadow:6px 6px 0 var(--c),0 0 30px var(--c);animation:slam .6s .3s both}

    <circle cx="200" cy="200" r="44" fill="#fff" class="pulso"/><circle cx="200" cy="200" r="62" fill="${A}" opacity=".5" class="pulso" style="animation-delay:.3s"/>
    ${[0,1,2,3,4,5,6,7].map(i => `<line x1="200" y1="200" x2="${200 + 190 * Math.cos(i * .785)}" y2="${200 + 190 * Math.sin(i * .785)}" stroke="${A}" stroke-width="3" class="parp" style="animation-delay:${i * .15}s"/>`).join('')}
    <text x="200" y="392" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="26" fill="#fff" letter-spacing="6">30 AÑOS</text></svg>`,
  telepatia: () => `<svg viewBox="0 0 400 400"><g><circle cx="90" cy="210" r="46" fill="#1a0620" stroke="${A}" stroke-width="8"/><path d="M20 340c0-60 30-90 70-90s70 30 70 90z" fill="#1a0620" stroke="${A}" stroke-width="8"/></g>
    <g><circle cx="310" cy="210" r="46" fill="#1a0620" stroke="${A2}" stroke-width="8"/><path d="M240 340c0-60 30-90 70-90s70 30 70 90z" fill="#1a0620" stroke="${A2}" stroke-width="8"/></g>
    <circle cx="136" cy="160" r="10" fill="#fff" class="pulso"/><circle cx="160" cy="130" r="14" fill="#fff" class="pulso" style="animation-delay:.2s"/>
    <path d="M150 90c-30 0-40 40-12 48 4 20 36 24 46 6 30 4 46-30 22-44-6-22-36-26-56-10z" fill="#fff" class="pulso" style="animation-duration:2.4s"/>
    <text x="178" y="122" text-anchor="middle" font-family="Audiowide" font-size="15" fill="#09020f">pizza…</text>
    <path d="M150 215 Q200 150 250 215" stroke="${A}" stroke-width="6" fill="none" class="onda"/><path d="M150 235 Q200 170 250 235" stroke="${A2}" stroke-width="6" fill="none" class="onda" style="animation-direction:reverse"/>
    <rect x="250" y="38" width="130" height="50" rx="14" fill="${A2}" class="parp"/><text x="315" y="70" text-anchor="middle" font-family="Audiowide" font-size="17" fill="#09020f">¡REFRESCOS!</text></svg>`,
};

/* ─────────── parte B: escenas ─────────── */
const TIC = {};   // símbolo → precio simulado
function inicializaBolsa() {
  if (!G) return;
  G.orden.forEach(k => { TIC[G.spots[k].simbolo] = {p: rnd(40, 900), d: 0}; });
  const h = () => G.orden.map(k => { const s = G.spots[k].simbolo; return `<span class="it" data-s="${s}"></span>`; }).join('');
  $('bBolsaTxt').innerHTML = h() + h();
}
function tickBolsa() {
  if (!G) return;
  for (const s in TIC) { const o = TIC[s], v = o.p * rnd(-.012, .014); o.p += v; o.d = v / o.p * 100; }
  document.querySelectorAll('#bBolsaTxt .it').forEach(e => { const o = TIC[e.dataset.s]; e.innerHTML = `${e.dataset.s} <span class="${o.d >= 0 ? 'sube' : 'baja'}">${o.p.toFixed(2)} ${o.d >= 0 ? '▲' : '▼'}${Math.abs(o.d).toFixed(2)}%</span>`; });
  const tk = document.querySelector('.st .tick');
  if (tk) tk.innerHTML = G.orden.map(k => { const s = G.spots[k], o = TIC[s.simbolo]; return `<div style="border-color:${s.color}"><small>${s.corp}</small>${s.simbolo} <span class="${o.d >= 0 ? 'sube' : 'baja'}">${o.p.toFixed(1)} ${o.d >= 0 ? '▲' : '▼'}</span></div>`; }).join('');
}
function vars(s) { return `--c:${s.color};--c2:${s.color2}`; }
function tamNombre(n) { const L = Math.max(...n.split(' ').map(w => w.length)); return Math.min(138, Math.floor(1000 / (L * .84))); }
function escSpot(it) {
  const s = G.spots[it.id];
  return `<div class="esc on spotEsc" style="${vars(s)}"><div class="n8">PATROCINADOR ${it.n} DE ${G.orden.length}</div>
    <div class="marca-corp"><div class="rub">${s.rubro}</div><div class="cor">${s.corp}</div></div>
    <div class="prod"><div class="n" style="font-size:${tamNombre(s.producto)}px">${s.producto}</div><div class="s"><b>${s.slogan}</b></div></div>
    <div class="arte">${ARTE[s.arte]()}</div><div class="peg" id="peg"></div>
    <div class="tel"><span class="l">LLAME YA</span><span class="n">${s.tel}</span></div><div class="precio" id="precio"></div>
    <div class="legal"><span>${s.legal} &nbsp; ◆ &nbsp; ${s.legal}</span></div></div>`;
}
function escSting(it) {
  const s = G.spots[it.next];
  return `<div class="esc on" style="${vars(s)}"><div class="st"><div class="a">A CONTINUACIÓN</div><div class="b">${s.corp}</div><div class="c">${s.producto}</div><div class="d">${it.sub}</div><div class="tick"></div></div></div>`;
}
function escCortina() {
  const sp = G.orden.map(k => G.spots[k]);
  return `<div class="esc on cort"><div class="t">BLACKROSE TV · SEÑAL PIRATA 2049</div><div class="g">TANDA<br>COMERCIAL</div><div class="s">10 MINUTOS · INFOMERCIALES DEL AÑO 2049</div>
    <div class="marcas">${sp.map((s, i) => `<span style="--mc:${s.color};--i:${i}">${s.corp}</span>`).join('')}</div><div class="ficticio">TODO FICTICIO · TODO EXAGERADO · TODO CON GARANTÍA DE RISA</div></div>`;
}
function escCierre() {
  const col = ['#ff2fd6', '#00e5ff', '#ffe45e', '#3dff9a', '#b46bff', '#ff8f6b', '#ff3b3b'];
  return `<div class="esc on cierre"><div class="barras">${col.map(c => `<i style="background:${c}"></i>`).join('')}</div><div class="g">FIN DE LA TANDA</div><div class="s">VOLVEMOS AL SHOW · GRACIAS POR MIRAR BLACKROSE TV</div></div>`;
}
let popActual = -1;
function pegatina(it, tEn) {
  const s = G.spots[it.id], ps = s.pops; let k = -1;
  for (let i = 0; i < ps.length; i++) if (ps[i].t <= tEn) k = i;
  if (k === popActual) return; popActual = k; if (k < 0) return;
  const p = ps[k], pg = $('peg'), pr = $('precio'); if (!pg) return;
  if (p.precio) { pr.textContent = p.txt.replace('¡', '').replace('!', ''); pr.classList.add('on'); pg.innerHTML = `<div>${p.txt}</div>`; }
  else pg.innerHTML = `<div>${p.txt}</div>`;
}
function itemEn(t) { let k = 0; G.items.forEach((it, i) => { if (t >= it.t) k = i; }); return k; }
function reproduce(it, tEn) {
  if (MUDO) return;
  const v = $('voz');
  if (!it.audio && it.tipo !== 'spot') { v.pause(); return; }
  const src = it.tipo === 'spot' ? G.spots[it.id].audio : it.audio;
  v.src = '/mediotiempo/' + src; v.volume = 1; v.currentTime = Math.max(0, tEn);
  v.play().catch(() => { $('inicio').style.display = 'flex'; });
}
function actualizaB(t) {
  if (!G) return;
  const i = itemEn(t), it = G.items[i], tEn = t - it.t;
  if (i !== ultimoItem) {
    ultimoItem = i; popActual = -1;
    const s = it.tipo === 'spot' ? G.spots[it.id] : it.next ? G.spots[it.next] : null;
    const B = $('B'); B.style.setProperty('--c', s ? s.color : '#ff2fd6'); B.style.setProperty('--c2', s ? s.color2 : '#00e5ff');
    $('bEsc').innerHTML = it.tipo === 'spot' ? escSpot(it) : it.tipo === 'sting' ? escSting(it) : it.tipo === 'cortina' ? escCortina() : escCierre();
    reproduce(it, tEn); tickBolsa();
  }
  if (it.tipo === 'spot') pegatina(it, tEn);
  $('bReloj').textContent = mmss(G.total - t);
  $('bBarra').style.width = Math.min(100, t / G.total * 100) + '%';
}

/* ─────────── bucle y sincronía ─────────── */
function aplicaFase(fase) {
  if (fase === ultimaFase) return; ultimaFase = fase;
  document.body.dataset.fase = fase;
  const c = $('cama');
  if (!MUDO && VOL_CAMA > 0 && fase === 'B') { c.src = '/pausa/media/cama2.mp3'; c.volume = VOL_CAMA; c.play().catch(() => {}); }
  else { c.pause(); if (fase !== 'B') $('voz').pause(); }
  if (fase !== 'B' && fase !== 'fin') ultimoItem = -1;
}
async function sondea() {
  try {
    const r = await (await fetch('/api/mediotiempo', {cache: 'no-store'})).json();
    off = r.t - Date.now() / 1000; S = r;
  } catch (e) { /* servidor caído: se queda como está */ }
}
function bucle() {
  const ahora = Date.now() / 1000 + off;
  let fase = 'idle';
  if (S.activo) fase = S.fase === 'B' ? 'B' : S.fase === 'fin' ? 'fin' : 'A';
  aplicaFase(fase);
  if (fase === 'A') actualizaA(); else if (ultimoSeg && fase === 'idle') { ultimoSeg = ''; $('aCont').innerHTML = ''; }
  if ((fase === 'B' || fase === 'fin') && G) actualizaB(fase === 'fin' ? G.total - 0.01 : Math.min(G.total - .01, ahora - S.inicioB));
  requestAnimationFrame(bucle);
}
async function inicia() {
  try { G = await (await fetch('/mediotiempo/guion.json', {cache: 'no-store'})).json(); inicializaBolsa(); } catch (e) { console.warn('sin guion.json: correr generar.py'); }
  document.addEventListener('click', () => { $('inicio').style.display = 'none'; $('cama').play().catch(() => {}); });
  if (demo[0] === 'A') S = {activo: true, fase: 'A', seg: demo[1] || 'inicio', seg_t: 0};
  else if (demo[0] === 'B') S = {activo: true, fase: 'B', inicioB: Date.now() / 1000 - parseFloat(demo[1] || '0')};
  else { await sondea(); setInterval(sondea, 700); }
  setInterval(tickBolsa, 2500);
  bucle();
}
inicia();
</script></body></html>
