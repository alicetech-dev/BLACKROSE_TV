<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BlackRose TV</title>
<!-- Overlay de OBS (1920×1080, fondo transparente): logo BlackRose TV, EN VIVO + reloj, bloque actual, «a continuación»,
     zócalo con el titular y cortina al cambiar de bloque. Lee GET /api/programa (director/programacion.py).
     ?demo=1 = recorre los bloques sin director · ?logo=0 = sin el logo · ?zocalo=0 = sin el titular -->
<style>
@font-face{font-family:Monoton;src:url(/img/fuentes/monoton.woff2) format("woff2")}
@font-face{font-family:Audiowide;src:url(/img/fuentes/audiowide.woff2) format("woff2")}
@font-face{font-family:Orbitron;src:url(/img/fuentes/orbitron.woff2) format("woff2")}
@font-face{font-family:Rajdhani;src:url(/img/fuentes/rajdhani700.woff2) format("woff2");font-weight:700}
@font-face{font-family:VT323;src:url(/img/fuentes/vt323.woff2) format("woff2")}
:root{--rosa:#ff2fd6;--cian:#00e5ff;--rojo:#ff3b3b;--bloque:#ff2fd6;--fondo:rgba(8,2,14,.82);--txt:#f6eaff}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--txt);font-family:Rajdhani,sans-serif}

/* ── logo (esquina sup. izq.) ── */
#logo{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;filter:drop-shadow(0 0 10px rgba(255,47,214,.55))}
#logo svg{width:118px;height:118px;overflow:visible}
.marca{display:flex;flex-direction:column;line-height:1}
.marca .br{font-family:Monoton;font-size:54px;letter-spacing:2px;color:#fff;
  text-shadow:0 0 4px #fff,0 0 12px var(--rosa),0 0 26px var(--rosa),0 0 44px #a0007f;animation:zumbido 6s infinite}
.marca .fila{display:flex;align-items:center;gap:12px;margin-top:6px}
.tv{font-family:Audiowide;font-size:30px;padding:1px 12px 3px;border:3px solid var(--cian);color:var(--cian);border-radius:8px;
  text-shadow:0 0 10px var(--cian);box-shadow:0 0 12px rgba(0,229,255,.6),inset 0 0 10px rgba(0,229,255,.35);background:rgba(0,20,30,.55)}
.vivo{font-family:Orbitron;font-size:17px;letter-spacing:3px;background:var(--rojo);color:#fff;padding:5px 10px 4px;border-radius:4px;
  box-shadow:0 0 14px rgba(255,59,59,.8)}
.vivo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:8px;animation:late 1.2s infinite}
.reloj{font-family:VT323;font-size:30px;color:#fff;text-shadow:0 0 8px var(--cian)}
@keyframes late{50%{opacity:.15}}
@keyframes zumbido{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}}
.petalo{animation:respira 5s ease-in-out infinite;transform-origin:60px 52px}
@keyframes respira{50%{transform:scale(1.04)}}
.scan{animation:barre 3.2s linear infinite}
@keyframes barre{from{transform:translateY(-10px)}to{transform:translateY(100px)}}

/* ── bloque actual / a continuación (debajo del logo) ── */
#ahora{position:absolute;left:50%;top:184px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .5s}
.chip{display:inline-flex;align-items:center;gap:10px;font-family:Orbitron;font-size:21px;letter-spacing:2px;padding:7px 16px 6px 12px;
  background:var(--fondo);border-left:6px solid var(--bloque);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);
  box-shadow:0 0 18px color-mix(in srgb,var(--bloque) 50%,transparent)}
.chip small{font-family:Rajdhani;font-size:17px;letter-spacing:1px;color:var(--bloque);text-transform:uppercase}
.chip b{color:#fff;text-shadow:0 0 10px var(--bloque)}
.prox{font-family:Rajdhani;font-size:19px;color:#d7c6e6;padding-left:14px;letter-spacing:1px}
.prox b{color:#fff}

/* ── zócalo con el titular (abajo a la izq., encima de los subtítulos) ── */
#zocalo{position:absolute;left:50%;bottom:206px;width:max-content;max-width:1000px;transform:translate(-50%,40px);opacity:0;transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .5s}
#zocalo.si{transform:translate(-50%,0);opacity:1}
#zocalo .tag{display:inline-block;font-family:Orbitron;font-size:17px;letter-spacing:3px;color:#09020f;background:var(--bloque);padding:5px 14px 4px;
  box-shadow:0 0 16px var(--bloque)}
#zocalo .cuerpo{background:var(--fondo);border-left:6px solid var(--bloque);padding:10px 22px 12px;backdrop-filter:blur(3px);
  border-bottom:2px solid color-mix(in srgb,var(--bloque) 60%,transparent)}
#zocalo .tit{font-size:32px;line-height:1.08;color:#fff}
#zocalo .fuente{font-family:VT323;font-size:24px;color:var(--bloque);margin-top:4px;letter-spacing:1px}

/* ── cortina al cambiar de bloque ── */
#cortina{position:absolute;left:0;top:380px;width:1920px;height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:linear-gradient(90deg,transparent,rgba(8,2,14,.92) 18%,rgba(8,2,14,.92) 82%,transparent);clip-path:inset(0 50% 0 50%);
  transition:clip-path .6s cubic-bezier(.7,0,.2,1)}
#cortina.si{clip-path:inset(0 0 0 0)}
#cortina .pre{font-family:Audiowide;font-size:26px;letter-spacing:8px;color:var(--cian);text-shadow:0 0 10px var(--cian)}
#cortina .nom{font-family:Monoton;font-size:96px;color:#fff;letter-spacing:4px;text-shadow:0 0 8px #fff,0 0 22px var(--bloque),0 0 50px var(--bloque);margin:6px 0}
#cortina .sub{font-family:Rajdhani;font-size:28px;letter-spacing:6px;text-transform:uppercase;color:var(--bloque)}
#cortina::before,#cortina::after{content:"";position:absolute;left:18%;right:18%;height:3px;background:var(--bloque);box-shadow:0 0 14px var(--bloque)}
#cortina::before{top:18px}#cortina::after{bottom:18px}
.oculto{opacity:0}

/* ── barra superior: relojes con bandera + marquesina de acciones tech y criptos ── */
#barra{position:absolute;left:0;top:0;width:1920px;height:40px;display:flex;background:rgba(8,2,14,.9);
  border-bottom:2px solid var(--rosa);box-shadow:0 2px 16px rgba(255,47,214,.45);font-family:Rajdhani;font-size:23px;line-height:40px}
#relojes{display:flex;gap:18px;padding:0 18px 0 14px;background:linear-gradient(90deg,#1a0420,#0a0410);border-right:2px solid var(--cian);
  box-shadow:6px 0 14px rgba(0,229,255,.25);z-index:1;white-space:nowrap}
.rel{display:flex;align-items:center;gap:7px}
.rel svg{width:30px;height:20px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.rel span{font-size:17px;letter-spacing:2px;color:#cdb8df}
.rel b{font-family:VT323;font-size:30px;font-weight:400;color:#fff;text-shadow:0 0 8px var(--cian)}
#cinta{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
#pista{display:inline-flex;white-space:nowrap;will-change:transform;animation:corre var(--dur,120s) linear infinite}
@keyframes corre{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sec{font-family:Orbitron;font-size:15px;letter-spacing:3px;color:#09020f;background:var(--cian);padding:0 10px;margin:0 14px 0 26px;
  height:24px;line-height:25px;align-self:center;box-shadow:0 0 10px var(--cian)}
.sec.cr{background:#ffb627;box-shadow:0 0 10px #ffb627}
.it{margin-right:28px;color:#fff}
.it i{font-style:normal;color:#cdb8df;margin-left:6px}
.sube{color:#3dff9a!important}.baja{color:#ff4d6d!important}

/* ── aviso «Vuelvo en X min» (lo pone ella: POST :8822/api/aviso) ── */
#aviso{position:absolute;left:50%;top:236px;transform:translateX(-50%);display:flex;align-items:stretch;white-space:nowrap;
  font-family:Rajdhani;font-size:34px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,47,214,.55));transition:opacity .6s,transform .6s}
#aviso.oculto{opacity:0;transform:translate(-50%,-14px)}
#aviso .q{font-family:Monoton;font-size:32px;letter-spacing:2px;color:#fff;background:linear-gradient(180deg,#ff5ae2,#b0009a);padding:9px 18px 7px;
  text-shadow:0 0 8px #fff;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:30px}
#aviso .t{background:var(--fondo);border:2px solid var(--rosa);border-left:0;padding:8px 24px 6px 18px;color:#fff;margin-left:-12px;border-radius:0 10px 10px 0}
#aviso .t b{color:var(--cian);text-shadow:0 0 10px var(--cian);font-weight:700}
#aviso .c{font-family:VT323;font-size:36px;color:#ffe45e;margin-left:16px;text-shadow:0 0 8px #ffb627}
#aviso.ya .t{animation:late .9s infinite}

/* ── TRANSICIONES de la emisora (cuñas): las dispara el director (estado.cuna) o POST :8822/api/transicion ── */
#trans{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:hidden}
#trans>div{position:absolute;inset:0}
.banda{position:absolute;left:0;width:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(8,2,14,.94) 14%,rgba(8,2,14,.94) 86%,transparent)}
.banda::before,.banda::after{content:"";position:absolute;left:12%;right:12%;height:4px;background:var(--rosa);box-shadow:0 0 18px var(--rosa)}
.banda::before{top:14px}.banda::after{bottom:14px}
/* ident: «ESTO ES BLACKROSE TV · Tu fuente de información tecnológica» */
.t-ident .banda{top:350px;height:380px;animation:wipe 5.4s cubic-bezier(.7,0,.2,1) both}
.t-ident .pre{font-family:Audiowide;font-size:34px;letter-spacing:14px;color:var(--cian);text-shadow:0 0 12px var(--cian);animation:subeTxt .8s .5s both}
.t-ident .nom{font-family:Monoton;font-size:150px;letter-spacing:6px;color:#fff;margin:2px 0 6px;animation:subeTxt .8s .7s both,glitch 2.2s 1.6s infinite;
  text-shadow:0 0 6px #fff,0 0 22px var(--rosa),0 0 56px var(--rosa)}
.t-ident .sub{font-family:Audiowide;font-size:36px;letter-spacing:7px;color:#ffd1f6;text-transform:uppercase;animation:subeTxt .8s .95s both}
@keyframes wipe{0%{clip-path:inset(0 50% 0 50%)}12%,84%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 50% 0 50%)}}
@keyframes subeTxt{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes glitch{0%,86%,100%{transform:none;filter:none}88%{transform:translateX(-10px);filter:drop-shadow(6px 0 0 #0ff) drop-shadow(-6px 0 0 #f0f)}
  92%{transform:translateX(9px) skewX(-6deg);filter:drop-shadow(-6px 0 0 #0ff) drop-shadow(6px 0 0 #f0f)}}
/* ultima_hora */
.t-ultima .banda{top:320px;height:250px;background:linear-gradient(90deg,transparent,rgba(120,0,10,.95) 10%,rgba(190,10,25,.97) 50%,rgba(120,0,10,.95) 90%,transparent);
  animation:entraIzq 4.6s cubic-bezier(.2,.9,.2,1) both}
.t-ultima .banda::before,.t-ultima .banda::after{left:0;right:0;height:22px;background:repeating-linear-gradient(115deg,#ffe45e 0 26px,#1a0000 26px 52px);
  box-shadow:0 0 18px rgba(255,228,94,.6);animation:franja 1s linear infinite}
.t-ultima .banda::before{top:0}.t-ultima .banda::after{bottom:0}
.t-ultima .nom{font-family:Orbitron;font-weight:900;font-size:96px;letter-spacing:10px;color:#fff;text-shadow:0 0 18px #fff,0 0 40px #ff3b3b;margin-top:8px;animation:parpadeo .5s steps(2) infinite}
.t-ultima .sub{font-family:Audiowide;font-size:24px;letter-spacing:10px;color:#ffd7d7;margin-top:14px}
@keyframes entraIzq{0%{transform:translateX(-100%)}14%,84%{transform:none}100%{transform:translateX(100%)}}
@keyframes franja{to{background-position:52px 0}}
@keyframes parpadeo{50%{opacity:.78}}
/* volvemos: «VOLVEMOS EN UN MOMENTO» con barras de color */
.t-volvemos .banda{top:360px;height:330px;animation:wipe 5.2s cubic-bezier(.7,0,.2,1) both}
.t-volvemos .barras{position:absolute;left:12%;right:12%;top:34px;height:46px;display:flex;opacity:.92}
.t-volvemos .barras i{flex:1}
.t-volvemos .nom{font-family:Monoton;font-size:104px;color:#fff;letter-spacing:4px;margin-top:42px;text-shadow:0 0 8px #fff,0 0 26px var(--cian),0 0 52px var(--cian)}
.t-volvemos .sub{font-family:Audiowide;font-size:30px;letter-spacing:9px;color:var(--rosa);text-shadow:0 0 10px var(--rosa);margin-top:6px}
/* mercados: resalta la barra de arriba */
.t-mercados .flecha{position:absolute;right:24px;top:56px;display:flex;align-items:center;gap:12px;font-family:Orbitron;font-size:21px;letter-spacing:2px;color:#09020f;
  background:var(--cian);padding:10px 22px 9px;clip-path:polygon(0 0,100% 0,100% 100%,18px 100%,0 calc(100% - 18px));box-shadow:0 0 22px var(--cian);
  animation:bajaFlecha 4.6s cubic-bezier(.2,.9,.2,1) both}
.t-mercados .flecha b{animation:sube 1s ease-in-out infinite;font-size:30px}
.t-mercados .halo{position:absolute;left:0;top:0;width:1920px;height:44px;box-shadow:0 0 0 3px var(--cian),0 0 34px 6px var(--cian);animation:halo 4.6s ease-in-out both}
@keyframes bajaFlecha{0%{transform:translateY(-120px)}12%,86%{transform:none}100%{transform:translateY(-120px)}}
@keyframes sube{50%{transform:translateY(-8px)}}
@keyframes halo{0%,100%{opacity:0}15%,80%{opacity:1}30%,60%{opacity:.35}}
/* corte: barrido diagonal rápido entre noticias (no tapa a las dolls) */
.t-corte i{position:absolute;top:-100px;height:1300px;transform:skewX(-20deg) translateX(-700px)}
.t-corte .a{width:170px;background:linear-gradient(90deg,transparent,var(--rosa),transparent);box-shadow:0 0 50px var(--rosa);animation:barre2 1.15s cubic-bezier(.6,0,.3,1) both}
.t-corte .b{width:70px;background:linear-gradient(90deg,transparent,var(--cian),transparent);box-shadow:0 0 40px var(--cian);animation:barre2 1.15s .12s cubic-bezier(.6,0,.3,1) both}
.t-corte .c{width:26px;background:#fff;box-shadow:0 0 30px #fff;animation:barre2 1.15s .22s cubic-bezier(.6,0,.3,1) both}
@keyframes barre2{from{transform:skewX(-20deg) translateX(-300px)}to{transform:skewX(-20deg) translateX(2400px)}}
/* senal: señal pirata con estática */
.t-senal canvas{position:absolute;left:0;top:300px;width:1920px;height:480px;image-rendering:pixelated;opacity:.5;mix-blend-mode:screen;animation:fadeEst 4.2s both}
.t-senal .banda{top:420px;height:240px;background:linear-gradient(90deg,transparent,rgba(8,2,14,.9) 12%,rgba(8,2,14,.9) 88%,transparent);animation:wipe 4.2s both}
.t-senal .nom{font-family:Monoton;font-size:110px;color:#fff;letter-spacing:6px;text-shadow:0 0 8px #fff,0 0 28px var(--rosa);animation:glitch 1.2s infinite}
.t-senal .sub{font-family:VT323;font-size:42px;letter-spacing:6px;color:var(--cian);text-shadow:0 0 10px var(--cian)}
@keyframes fadeEst{0%{opacity:0}15%,80%{opacity:.5}100%{opacity:0}}
#barra.resalta{animation:parp 4.6s both}
@keyframes parp{0%,100%{filter:none}20%,70%{filter:brightness(1.5)}}

/* ── caja de chat (abajo a la der., encima del DATA FEED) ── */
#chat{position:absolute;right:22px;bottom:62px;width:430px;display:flex;flex-direction:column;gap:6px;transition:opacity .6s}
#chat .cab{align-self:flex-start;font-family:Orbitron;font-size:14px;letter-spacing:3px;color:#09020f;background:var(--rosa);padding:4px 10px 3px;
  box-shadow:0 0 12px var(--rosa)}
#chat .cab i{font-style:normal;color:#fff}
.msg{background:rgba(8,2,14,.84);border-left:4px solid var(--c,#00e5ff);padding:6px 12px 7px;font-size:22px;line-height:1.15;color:#f6eaff;
  animation:entraMsg .45s cubic-bezier(.2,.9,.2,1) both;word-wrap:break-word;box-shadow:0 0 10px rgba(0,0,0,.4)}
.msg b{color:var(--c,#00e5ff);margin-right:6px;text-shadow:0 0 8px color-mix(in srgb,var(--c,#00e5ff) 60%,transparent)}
.msg.viejo{opacity:.55}
@keyframes entraMsg{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* ── SPOTS a pantalla completa, con dos portales donde se ve a las dolls ── */
.spot{--dur:14s;position:absolute;inset:0;overflow:hidden;animation:spotIO var(--dur) linear both}
@keyframes spotIO{0%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
.spot .fondo{position:absolute;inset:0;
  -webkit-mask:radial-gradient(ellipse 250px 430px at 250px 690px,transparent 78%,#000 100%),radial-gradient(ellipse 285px 500px at 1650px 570px,transparent 78%,#000 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.spot canvas{position:absolute;inset:0;width:1920px;height:1080px}
.portal{position:absolute;border-radius:50%;border:3px solid var(--sc,#ff2fd6);box-shadow:0 0 26px var(--sc,#ff2fd6),inset 0 0 30px var(--sc,#ff2fd6);
  animation:portalLate 2.4s ease-in-out infinite}
.portal.pj{left:0;top:260px;width:500px;height:860px}
.portal.pk{left:1365px;top:70px;width:570px;height:1000px}
@keyframes portalLate{50%{box-shadow:0 0 44px var(--sc,#ff2fd6),inset 0 0 50px var(--sc,#ff2fd6)}}
.placa{position:absolute;font-family:Orbitron;font-size:24px;letter-spacing:4px;color:#fff;background:rgba(8,2,14,.9);padding:6px 16px 5px;
  border-left:5px solid var(--sc,#ff2fd6);animation:subeTxt .7s 1.2s both;white-space:nowrap}
.placa small{display:block;font-family:Rajdhani;font-size:17px;letter-spacing:2px;color:var(--sc,#ff2fd6);text-transform:uppercase}
.placa.pj{left:40px;top:980px}.placa.pk{left:1420px;top:980px}
.scentro{position:absolute;left:520px;width:860px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kick{font-family:Audiowide;font-size:26px;letter-spacing:10px;color:var(--sc2,#00e5ff);text-shadow:0 0 12px var(--sc2,#00e5ff);animation:subeTxt .8s .5s both}
.stit{font-family:Monoton;font-size:104px;line-height:1.02;color:#fff;margin:14px 0 10px;text-shadow:0 0 6px #fff,0 0 22px var(--sc,#ff2fd6),0 0 54px var(--sc,#ff2fd6);
  animation:subeTxt .9s .8s both}
.ssub{font-family:Rajdhani;font-size:40px;letter-spacing:3px;color:#ffe7fb;animation:subeTxt .8s 1.6s both;max-width:820px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
.chips span{font-family:Orbitron;font-size:19px;letter-spacing:2px;padding:7px 14px 6px;border:2px solid var(--sc2,#00e5ff);color:var(--sc2,#00e5ff);
  background:rgba(0,0,0,.45);box-shadow:0 0 10px color-mix(in srgb,var(--sc2,#00e5ff) 50%,transparent);animation:subeTxt .6s both}
.firma{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;align-items:center;gap:14px;font-family:Audiowide;font-size:24px;
  letter-spacing:4px;color:#fff;animation:subeTxt .8s 2.4s both;white-space:nowrap}
.firma b{font-family:Monoton;font-weight:400;font-size:34px;color:#fff;text-shadow:0 0 14px var(--rosa)}
.firma i{font-style:normal;font-size:18px;color:#cdb8df;letter-spacing:2px}
.cine::before,.cine::after{content:"";position:absolute;left:0;right:0;height:84px;background:#000;z-index:2}
.cine::before{top:0}.cine::after{bottom:0}
.s-documental .stit{font-family:Rajdhani;font-weight:700;font-size:118px;letter-spacing:18px;text-shadow:0 0 30px rgba(255,190,90,.6)}
.s-documental .kick{font-family:Rajdhani;font-weight:700;letter-spacing:7px;white-space:nowrap}
.s-ciencia .stit{font-family:Orbitron;font-size:96px;letter-spacing:10px}
.s-gamer .stit{font-family:VT323;font-size:150px;letter-spacing:6px}
.s-conductoras .portal{border-width:5px}

/* ── pantalla de la redacción: las capturas que trajo Blackrose, en el centro, mientras las dolls la comentan ── */
#pnota{position:absolute;left:50%;top:250px;width:800px;height:480px;transform:translateX(-50%) scale(.92);opacity:0;
  transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.2,1);background:rgba(8,2,14,.92);border:3px solid var(--bloque);
  box-shadow:0 0 30px color-mix(in srgb,var(--bloque) 55%,transparent);padding:10px}
#pnota.si{opacity:1;transform:translateX(-50%) scale(1)}
#pnota .tag{position:absolute;left:-3px;top:-34px;font-family:Orbitron;font-size:16px;letter-spacing:3px;color:#09020f;background:var(--bloque);
  padding:6px 12px 5px;box-shadow:0 0 14px var(--bloque)}
#pnota .tag i{font-style:normal;color:#fff;margin-left:8px}
#pnota img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;opacity:0;transition:opacity .9s}
#pnota img.on{opacity:1}
#pnota .pts{position:absolute;right:12px;bottom:-26px;display:flex;gap:6px}
#pnota .pts i{width:10px;height:10px;border-radius:50%;background:#5a3a6a}
#pnota .pts i.on{background:var(--bloque);box-shadow:0 0 8px var(--bloque)}

/* ── meta de suscriptores: mini barra dentro de la marquesina (datos: /api/metas) ── */
#metaBar{display:flex;align-items:center;gap:12px;padding:0 18px;border-right:2px solid var(--rosa);background:linear-gradient(90deg,#14061f,#0a0410);white-space:nowrap;z-index:1;
  box-shadow:6px 0 14px rgba(255,47,214,.2)}
#metaBar .mt{font-family:Orbitron;font-size:15px;letter-spacing:3px;color:var(--cian);text-shadow:0 0 8px var(--cian)}
#metaBar .mb{position:relative;width:190px;height:16px;background:#1a0b28;border:2px solid #5a3478}
#metaBar .mf{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--rosa),#b46bff 60%,var(--cian));box-shadow:0 0 10px rgba(255,47,214,.7);transition:width 1.6s cubic-bezier(.2,.9,.2,1)}
#metaBar .mf::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(0,0,0,.3) 8px 10px)}
#metaBar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.5);z-index:1}
#metaBar .mk.ok{background:var(--oro,#ffe45e);box-shadow:0 0 6px #ffe45e}
#metaBar .mk.sig{background:#fff;animation:late 1s steps(2) infinite}
#metaBar .mn{font-family:VT323;font-size:32px;color:#fff;text-shadow:0 0 8px var(--rosa)}

#metaBar .ms b{color:#ffe45e;text-shadow:0 0 8px #ffb627}
#metaBar.sube{animation:subeMeta 1.4s ease-out}
@keyframes subeMeta{0%,100%{filter:none}30%{filter:brightness(1.8)}}
#metaBan{position:absolute;left:50%;top:236px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:0;white-space:nowrap;
  filter:drop-shadow(0 0 16px rgba(255,228,94,.6));transition:opacity .5s,transform .5s}
#metaBan.si{opacity:1;transform:translate(-50%,0)}
#metaBan .q{font-family:Orbitron;font-size:24px;letter-spacing:4px;color:#09020f;background:#ffe45e;padding:11px 20px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:32px}
#metaBan .t{font-family:Rajdhani;font-size:36px;color:#fff;background:var(--fondo);border:2px solid #ffe45e;border-left:0;padding:6px 24px 4px 14px;margin-left:-12px;border-radius:0 10px 10px 0}
#metaBan .t b{color:#ffe45e}
</style>

<body>
<div id="barra">
  <div id="relojes">
    <div class="rel"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#d52b1e"/><rect width="30" height="10" fill="#fff"/><rect width="10" height="10" fill="#0039a6"/><polygon fill="#fff" points="5,2 5.9,4.5 8.5,4.5 6.4,6.1 7.2,8.6 5,7.1 2.8,8.6 3.6,6.1 1.5,4.5 4.1,4.5"/></svg><span>CHILE</span><b id="hCL">--:--</b></div>
    <div class="rel"><svg viewBox="0 0 30 20"><rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/><circle cx="15" cy="10" r="2.8" fill="#8c5a2b"/><path d="M12.6 11.8 Q15 14 17.4 11.8" stroke="#006847" stroke-width=".9" fill="none"/></svg><span>MÉXICO</span><b id="hMX">--:--</b></div>
    <div class="rel"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/></svg><span>TOKYO</span><b id="hJP">--:--</b></div>

<script>
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
if (q.get('logo') === '0') $('logo').style.display = 'none';
const conZocalo = q.get('zocalo') !== '0';
let bloqueVisto = null, tituloVisto = null;

function reloj() {
  $('reloj').textContent = new Date().toLocaleTimeString('es-CL', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
}
setInterval(reloj, 5000); reloj();

// relojes de la barra (24 h): Chile, México, Tokio
const ZONAS = {hCL: 'America/Santiago', hMX: 'America/Mexico_City', hJP: 'Asia/Tokyo'};
function relojes() {
  const d = new Date();
  for (const [id, tz] of Object.entries(ZONAS))
    $(id).textContent = d.toLocaleTimeString('es-CL', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: tz});
}
setInterval(relojes, 5000); relojes();

// marquesina: /api/mercados cada 5 min; lo nuevo entra al terminar la vuelta (sin saltos)
let pendiente = null;
const fmt = p => p >= 1000 ? p.toLocaleString('en-US', {maximumFractionDigits: 0}) : p >= 1 ? p.toFixed(2) : p.toFixed(4);
function items(lista) {
  return lista.map(x => { const c = x.c || 0, cl = c >= 0 ? 'sube' : 'baja';
    return '<span class="it">' + x.s + ' <b>$' + fmt(x.p) + '</b><i class="' + cl + '">' + (c >= 0 ? '▲' : '▼') + ' ' +
      Math.abs(c).toFixed(2) + '%</i></span>'; }).join('');
}
function armar(d) {
  const una = '<span class="sec">ACCIONES TECH</span>' + items(d.acciones || []) + '<span class="sec cr">CRIPTO</span>' + items(d.cripto || []);
  const p = $('pista');
  p.innerHTML = una + una;   // dos copias: el -50% empalma sin corte
  p.style.setProperty('--dur', Math.max(40, p.scrollWidth / 2 / 90) + 's');   // ~90 px/s
}
$('pista').addEventListener('animationiteration', () => { if (pendiente) { armar(pendiente); pendiente = null; } });
async function mercados(primera) {
  try {
    const d = await (await fetch('/api/mercados', {cache: 'no-store'})).json();
    if (!(d.acciones || []).length && !(d.cripto || []).length) return setTimeout(() => mercados(true), 15000);
    if (primera || !$('pista').innerHTML) armar(d); else pendiente = d;
  } catch (_) { setTimeout(() => mercados(true), 15000); }
}
if (q.get('demo')) armar({acciones: [{s: 'NVDA', p: 152.18, c: -2.1}, {s: 'AAPL', p: 352.85, c: .27}, {s: 'NINTENDO', p: 18.2, c: 1.4}],
                          cripto: [{s: 'BTC', p: 62475, c: -2.2}, {s: 'ETH', p: 1751.9, c: -1.39}]});
else { mercados(true); setInterval(() => mercados(false), 300000); }

function cortina(b) {
  $('cnom').textContent = b.nombre; $('csub').textContent = b.sub || '';
  $('cortina').classList.add('si');
  setTimeout(() => $('cortina').classList.remove('si'), 5200);
}


// ── pantalla de la redacción ──
let pnClave = '', pnTimer = null;
function pantallaNota(n) {
  const imgs = (n && n.imagenes) || [], clave = imgs.join('|'), box = $('pnota');
  if (clave === pnClave) return;
  pnClave = clave; clearInterval(pnTimer);
  box.querySelectorAll('img').forEach(x => x.remove()); $('pnpts').innerHTML = '';
  if (!imgs.length || q.get('pantalla') === '0') { box.classList.remove('si'); return; }
  imgs.forEach((u, i) => { const im = new Image(); im.src = u; if (!i) im.className = 'on'; box.appendChild(im);
    $('pnpts').insertAdjacentHTML('beforeend', '<i' + (i ? '' : ' class="on"') + '></i>'); });
  box.classList.add('si');
  let i = 0;
  if (imgs.length > 1) pnTimer = setInterval(() => {
    const ims = box.querySelectorAll('img'), pts = $('pnpts').children;
    ims[i].classList.remove('on'); pts[i].classList.remove('on'); i = (i + 1) % ims.length; ims[i].classList.add('on'); pts[i].classList.add('on');
  }, 7000);
}
function pintar(e) {
  const b = e.bloque, prendido = e.activo !== false && b;
  $('ahora').classList.toggle('oculto', !prendido);
  if (!prendido) { $('zocalo').classList.remove('si'); pantallaNota(null); return; }
  document.documentElement.style.setProperty('--bloque', b.color || '#ff2fd6');
  $('bloque').textContent = b.nombre; $('prox').textContent = e.siguiente ? e.siguiente.nombre : '—';
  if (b.id !== bloqueVisto) { if (bloqueVisto !== null || e.paso === 'cortina') cortina(b); bloqueVisto = b.id; }
  pantallaNota(e.noticia);
  const n = conZocalo && e.noticia;
  if (n && n.titulo !== tituloVisto) {   // titular nuevo: sale y vuelve a entrar
    $('zocalo').classList.remove('si');
    setTimeout(() => {
      $('ztag').textContent = b.nombre; $('ztit').textContent = n.titulo; $('zfu').textContent = '▶ ' + (n.fuente || '');
      $('zocalo').classList.add('si');
    }, tituloVisto ? 750 : 0);
    tituloVisto = n.titulo;
  } else if (!n) { $('zocalo').classList.remove('si'); tituloVisto = null; }
}


// ── aviso «Vuelvo en X min con …» ──
let aviso = null;
function pintarAviso() {
  const el = $('aviso'), a = aviso;
  if (!a || !a.activo) { el.classList.add('oculto'); return; }
  const rest = (a.hasta * 1000 - Date.now()) / 1000, ya = rest <= 0;
  const t = rest > 60 ? Math.ceil(rest / 60) + ' min' : Math.max(0, Math.ceil(rest)) + ' s';
  $('avq').textContent = (a.quien || 'BLACKROSE').toUpperCase();
  let txt = ya ? '¡Ya vuelvo!' : (a.texto ? a.texto.replace('{t}', '<b>' + t + '</b>') : 'Vuelvo en <b>' + t + '</b>');
  if (!ya && !a.texto) txt += ' con <b>' + (a.con || 'Fast Penguin').toUpperCase() + '</b>';
  $('avt').innerHTML = txt;
  el.classList.toggle('ya', ya); el.classList.remove('oculto');
}
setInterval(pintarAviso, 1000);

// ── transiciones (cuñas) ──
const DUR = {ident: 5.4, ultima_hora: 4.6, volvemos: 5.2, mercados: 4.6, corte: 1.5, senal: 4.2};
const BARRAS = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
const PLANTILLA = {
  ident: '<div class="t-ident"><div class="banda"><div class="pre">ESTO ES</div><div class="nom">BLACKROSE TV</div><div class="sub">Tu fuente de información tecnológica</div></div></div>',
  ultima_hora: '<div class="t-ultima"><div class="banda"><div class="nom">ÚLTIMA HORA</div><div class="sub">BLACKROSE TV · EN VIVO</div></div></div>',
  volvemos: '<div class="t-volvemos"><div class="banda"><div class="barras">' + BARRAS.map(c => '<i style="background:' + c + '"></i>').join('') +
    '</div><div class="nom">VOLVEMOS EN UN MOMENTO</div><div class="sub">BLACKROSE TV</div></div></div>',
  mercados: '<div class="t-mercados"><div class="halo"></div><div class="flecha"><b>▲</b>MERCADOS EN VIVO</div></div>',
  corte: '<div class="t-corte"><i class="a"></i><i class="b"></i><i class="c"></i></div>',
  senal: '<div class="t-senal"><canvas width="240" height="60"></canvas><div class="banda"><div class="nom">SEÑAL PIRATA</div><div class="sub">BLACKROSE TV · 24/7 · MANSIÓN BLACKROSE</div></div></div>'
};

// ── SPOTS: pantalla completa con portales a las dolls (las dolls quedan debajo en OBS y se ven por los agujeros) ──
const SPOTS = {
  spot_noticias: {cls: 's-noticias', sc: '#ff3b3b', sc2: '#00e5ff', kick: 'BLACKROSE TV', tit: 'NOTICIAS<br>24/7',
    sub: 'Lo que pasa en el mundo, explicado sin filtro', chips: ['TECNOLOGÍA', 'GAMER', 'IA', 'INTERNACIONAL'], fondo: 'globo'},
  spot_documental: {cls: 's-documental cine', sc: '#ffb35c', sc2: '#ffd9a0', kick: 'ESTRENO · DOCUMENTALES BLACKROSE', tit: 'MENTES<br>SINTÉTICAS',
    sub: '¿Pueden soñar las máquinas? Una investigación desde adentro', chips: ['ESTA SEMANA', 'SOLO EN BLACKROSE TV'], fondo: 'red'},
  spot_ciencia: {cls: 's-ciencia', sc: '#7a8cff', sc2: '#9ff4ff', kick: 'BLACKROSE SCIENCE', tit: 'COSMOS<br>PIXEL',
    sub: 'Explora el universo con Joy y Kuroki', chips: ['ESPACIO', 'FÍSICA', 'FUTURO'], fondo: 'cosmos'},
  spot_gamer: {cls: 's-gamer', sc: '#ff2fd6', sc2: '#ffe14d', kick: 'BLACKROSE TV PRESENTA', tit: 'GAMER ZONE',
    sub: 'Lanzamientos, industria, esports e indies que merecen amor', chips: ['NOTICIAS', 'ANÁLISIS', 'OPINIÓN'], fondo: 'grilla'},
  spot_conductoras: {cls: 's-conductoras', sc: '#ff2fd6', sc2: '#00e5ff', kick: 'LAS VOCES DE BLACKROSE TV', tit: 'JOY<br>& KUROKI',
    sub: 'Una neko que analiza. Una baterista que no se calla.', chips: ['EN VIVO', '24/7', 'ESCRÍBELES EN EL CHAT'], fondo: 'focos'},
};
function spotHTML(id) {
  const c = SPOTS[id];
  return '<div class="spot ' + c.cls + '" style="--sc:' + c.sc + ';--sc2:' + c.sc2 + '"><div class="fondo"><canvas width="1920" height="1080"></canvas></div>' +
    '<div class="portal pj"></div><div class="portal pk"></div>' +
    '<div class="placa pj">JOY<small>Presentadora · IA</small></div><div class="placa pk">KUROKI<small>Analista · baterista</small></div>' +
    '<div class="scentro"><div class="kick">' + c.kick + '</div><div class="stit">' + c.tit + '</div><div class="ssub">' + c.sub + '</div>' +
    '<div class="chips">' + c.chips.map((x, i) => '<span style="animation-delay:' + (2 + i * .25) + 's">' + x + '</span>').join('') + '</div></div>' +
    '<div class="firma"><b>BLACKROSE</b> TV <i>· twitch.tv/barbieblackrose</i></div></div>';
}
for (const id in SPOTS) { PLANTILLA[id] = spotHTML(id); DUR[id] = 14; }

function animarSpot(id, box) {   // fondo animado en canvas; se corta solo cuando el spot sale del DOM
  const cv = box.querySelector('.spot canvas'); if (!cv) return;
  const g = cv.getContext('2d'), W = 1920, H = 1080, t0 = performance.now(), tipo = SPOTS[id].fondo;
  const P = Array.from({length: tipo === 'cosmos' ? 420 : 90}, () => ({x: Math.random() * W, y: Math.random() * H,
    z: Math.random(), vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4}));
  function cuadro(now) {
    if (!box.contains(cv)) return;
    const t = (now - t0) / 1000;
    if (tipo === 'globo') {
      const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#12030a'); gr.addColorStop(1, '#2a0610');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2, R = 420, rot = t * .35; g.lineWidth = 1.4;
      for (let la = -75; la <= 75; la += 15) {   // paralelos
        const y = cy - R * Math.sin(la * Math.PI / 180), r = R * Math.cos(la * Math.PI / 180);
        g.strokeStyle = 'rgba(255,59,59,.35)'; g.beginPath(); g.ellipse(cx, y, r, r * .18, 0, 0, Math.PI * 2); g.stroke(); }
      for (let lo = 0; lo < 180; lo += 15) {   // meridianos girando
        const a = (lo * Math.PI / 180) + rot, rx = Math.abs(R * Math.cos(a));
        g.strokeStyle = 'rgba(0,229,255,' + (.15 + .35 * Math.abs(Math.sin(a))) + ')'; g.beginPath(); g.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2); g.stroke(); }
      g.strokeStyle = 'rgba(255,255,255,.08)'; for (let y = (t * 60) % 6; y < H; y += 6) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    } else if (tipo === 'red') {
      const dg = g.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1100); dg.addColorStop(0, '#2a1606'); dg.addColorStop(1, '#070300');
      g.fillStyle = dg; g.fillRect(0, 0, W, H);
      for (const p of P) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
        const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
        if (d < 190) { g.strokeStyle = 'rgba(255,179,92,' + (1 - d / 190) * .45 + ')'; g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke(); } }
      for (const p of P) { g.fillStyle = 'rgba(255,215,150,.9)'; g.beginPath(); g.arc(p.x, p.y, 2 + p.z * 2.5, 0, 7); g.fill(); }
    } else if (tipo === 'cosmos') {
      g.fillStyle = '#03040f'; g.fillRect(0, 0, W, H);
      for (const p of P) {   // estrellas que vienen hacia la cámara
        p.z -= .006; if (p.z <= .02) { p.z = 1; p.x = Math.random() * W; p.y = Math.random() * H; }
        const sx = W / 2 + (p.x - W / 2) / p.z, sy = H / 2 + (p.y - H / 2) / p.z;
        g.fillStyle = 'rgba(200,220,255,' + (1 - p.z) + ')'; g.fillRect(sx, sy, 2.4 * (1 - p.z) + .6, 2.4 * (1 - p.z) + .6); }
      const px = W / 2 + 330, py = H - 300, pr = 105;
      const pg = g.createRadialGradient(px - 50, py - 50, 20, px, py, pr); pg.addColorStop(0, '#9ff4ff'); pg.addColorStop(1, '#2b2a8c');
      g.fillStyle = pg; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
      g.strokeStyle = 'rgba(159,244,255,.7)'; g.lineWidth = 6; g.beginPath(); g.ellipse(px, py, pr * 1.9, pr * .35, -.25, 0, 7); g.stroke(); g.lineWidth = 1;
    } else if (tipo === 'grilla') {
      const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#12002a'); gr.addColorStop(.55, '#3a0050'); gr.addColorStop(1, '#05000c');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
      const hz = H * .56; const sol = g.createLinearGradient(0, hz - 300, 0, hz); sol.addColorStop(0, '#ffe14d'); sol.addColorStop(1, '#ff2fd6');
      g.fillStyle = sol; g.beginPath(); g.arc(W / 2, hz, 260, Math.PI, 0); g.fill();
      g.fillStyle = '#12002a'; for (let k = 0; k < 7; k++) g.fillRect(W / 2 - 270, hz - 18 - k * 34, 540, 6 + k * .8);
      g.strokeStyle = 'rgba(255,47,214,.8)'; g.lineWidth = 2;
      for (let k = 0; k < 24; k++) { const z = ((k + (t * 2) % 1) / 24); const y = hz + Math.pow(z, 2.2) * (H - hz);
        g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
      for (let k = -20; k <= 20; k++) { g.beginPath(); g.moveTo(W / 2 + k * 30, hz); g.lineTo(W / 2 + k * 260, H); g.stroke(); }
      g.lineWidth = 1;
    } else {   // focos
      g.fillStyle = '#0c0212'; g.fillRect(0, 0, W, H);
      for (let k = 0; k < 4; k++) { const a = Math.sin(t * .8 + k * 1.7) * .5, x = 300 + k * 440;
        const fg = g.createLinearGradient(x, 0, x + Math.sin(a) * 900, H); fg.addColorStop(0, k % 2 ? 'rgba(0,229,255,.35)' : 'rgba(255,47,214,.35)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = fg; g.beginPath(); g.moveTo(x - 20, 0); g.lineTo(x + 20, 0); g.lineTo(x + Math.sin(a) * 900 + 260, H); g.lineTo(x + Math.sin(a) * 900 - 260, H); g.fill(); }
      for (const p of P) { p.y -= .8 + p.z; if (p.y < -20) p.y = H + 20; g.fillStyle = 'rgba(255,120,230,' + (.3 + p.z * .5) + ')';
        g.font = (14 + p.z * 22) + 'px sans-serif'; g.fillText('♥', p.x, p.y); }
    }
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
}

// ── chat de Twitch (lo lee este mismo servidor, sin las dolls) ──
let chatVisto = new Set();
const escapar = t => t.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
async function leerChat() {
  try {
    const lista = await (await fetch('/api/chat', {cache: 'no-store'})).json(), cont = $('msgs'), ahora = Date.now() / 1000;
    for (const m of lista.slice(-6)) {
      if (chatVisto.has(m.id)) continue; chatVisto.add(m.id);
      const el = document.createElement('div'); el.className = 'msg'; el.dataset.t = m.t;
      if (m.color) el.style.setProperty('--c', m.color);
      el.innerHTML = '<b>' + escapar(m.autor) + '</b>' + escapar(m.texto); cont.appendChild(el);
    }
    while (cont.children.length > 6) cont.firstChild.remove();
    for (const el of cont.children) { el.classList.toggle('viejo', ahora - el.dataset.t > 90); if (ahora - el.dataset.t > 300) el.remove(); }
    $('chat').classList.toggle('oculto', !cont.children.length || q.get('chat') === '0');
  } catch (_) {}
}
if (!q.get('demo')) { leerChat(); setInterval(leerChat, 1500); }
let transTimer = null, estatica = null;
function lanzar(tipo) {
  if (!PLANTILLA[tipo]) return;
  clearTimeout(transTimer); clearInterval(estatica);
  const box = $('trans'); box.innerHTML = PLANTILLA[tipo];
  if (tipo.startsWith('spot_')) animarSpot(tipo, box);
  const barra = $('barra'); barra.classList.remove('resalta');
  if (tipo === 'mercados') { void barra.offsetWidth; barra.classList.add('resalta'); }
  const cv = box.querySelector('canvas');
  if (cv) { const g = cv.getContext('2d'), im = g.createImageData(cv.width, cv.height);
    estatica = setInterval(() => { for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255 | 0;
      im.data[i] = v; im.data[i + 1] = v * .8; im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }, 60); }
  transTimer = setTimeout(() => { box.innerHTML = ''; clearInterval(estatica); barra.classList.remove('resalta'); }, (DUR[tipo] || 5) * 1000 + 200);
}
let cunaVista = null, transVista = null;
function extras(e) {   // lo que viene en cada sondeo: aviso, cuña del director, transición manual
  aviso = e.aviso || null; pintarAviso();
  if (e.cuna && e.cuna.id !== cunaVista) { if (cunaVista !== null && Date.now() / 1000 - e.cuna.t < 20) lanzar(e.cuna.tipo); cunaVista = e.cuna.id; }
  if (e.trans && e.trans.id !== transVista) { if (transVista !== null && Date.now() / 1000 - e.trans.t < 20) lanzar(e.trans.tipo); transVista = e.trans.id; }
}
addEventListener('message', m => { if (m.data && m.data.trans) lanzar(m.data.trans); });   // galería /transiciones
if (q.get('trans')) { const t = q.get('trans'); setTimeout(() => lanzar(t), 800); if (q.get('bucle')) setInterval(() => lanzar(t), (DUR[t] + 2.5) * 1000); }
if (q.get('aviso')) { aviso = {activo: true, hasta: Date.now() / 1000 + parseFloat(q.get('aviso')) * 60, con: 'Fast Penguin'}; pintarAviso(); }

// ── meta de suscriptores en la marquesina ──
let metaPrev = null;
async function metas() {
  let d; try { d = await (await fetch('/api/metas', {cache: 'no-store'})).json(); } catch (_) { return; }
  const max = +d.max || 100, act = Math.max(0, Math.min(max, +d.actual || 0)), hitos = (d.hitos || []).slice().sort((a, b) => a.en - b.en), sig = hitos.find(h => h.en > act);
  $('metaBar').style.display = 'flex'; $('mn').textContent = act; $('mm').textContent = max;
  $('ms').innerHTML = sig ? `▶ <b>${sig.en}</b> ${sig.premio}` : '<b>¡TODAS LAS METAS!</b>';
  const mb = $('mb'); mb.querySelectorAll('.mk').forEach(e => e.remove());
  hitos.forEach(h => { const k = document.createElement('i'); k.className = 'mk' + (h.en <= act ? ' ok' : '') + (sig && h.en === sig.en ? ' sig' : ''); k.style.left = (h.en / max * 100) + '%'; mb.append(k); });
  $('mf').style.width = (act / max * 100) + '%';
  if (metaPrev !== null && act > metaPrev) {
    const bar = $('metaBar'); bar.classList.remove('sube'); void bar.offsetWidth; bar.classList.add('sube');
    const h = hitos.filter(x => x.en > metaPrev && x.en <= act).pop();
    if (h) { $('mbt').innerHTML = `<b>${h.en} SUBS</b> · ${h.premio}`; $('metaBan').classList.add('si'); setTimeout(() => $('metaBan').classList.remove('si'), 9000); }
  }
  metaPrev = act;
}
metas(); setInterval(metas, 4000);

async function leer() {
  try { const e = await (await fetch('/api/programa', {cache: 'no-store'})).json(); extras(e); pintar(e); } catch (_) { /* director caído: queda lo último */ }
}

if (q.get('demo')) {   // sin director: recorre bloques de muestra
  const B = [
    {id: 'tecnologia', nombre: 'TECNOLOGÍA', sub: 'hardware · software · Linux · ciencia', color: '#00e5ff'},
    {id: 'gamer', nombre: 'NOTICIAS GAMER', sub: 'lanzamientos · industria · esports · indie', color: '#ff2fd6'},
    {id: 'ia', nombre: 'INTELIGENCIA ARTIFICIAL', sub: 'modelos · empresas · regulación · impacto', color: '#b46bff'},
    {id: 'internacional', nombre: 'CONTINGENCIA INTERNACIONAL', sub: 'geopolítica · economía · conflictos · cumbres', color: '#ff3b3b'}];
  let i = 0;
  const paso = () => { const b = B[i % 4];
    pintar({activo: true, bloque: b, siguiente: B[(i + 1) % 4], paso: 'cortina',
            noticia: {titulo: 'Titular de ejemplo para el bloque ' + b.nombre.toLowerCase() + ': así se ve el zócalo', fuente: 'Medio de ejemplo'}});
    i++; };
  paso(); setInterval(paso, 12000);
} else if (!q.get('trans') && !q.get('aviso')) { leer(); setInterval(leer, 1000); }
