# MODO JUEGO (copia de dolls.t800.yaml): comenta cada 2-3 min mientras ella juega. Cambiar: ~/joy_vmc/t800_modo.sh juego|cowork
# El T-800 amigable, solo:  ./dolls.sh start --t800   (el director arranca con --config director/dolls.t800.yaml)
# Cerebro: pack `t800` del agente (memoria propia en ~/proyectos/agente_unificado/data_t800). Cuerpo: el pixel art de OBS
# (~/overlays_t800/t8_cuerpo.py en :8772 → t8_avatar.html?ws=ws://127.0.0.1:8772/avatar). Sin Warudo ni joy_vmc.
sfw: true
agente: ws://127.0.0.1:8791
xtts_url: http://127.0.0.1:9020/tts
llm_directo: http://127.0.0.1:8084

usuario: {id: 0, nombre: Alice}

audio:
  sink: dolls
  bloque_ms: 20
  adelanto_ms: 30

opinar: 0

dolls:
  t800:
    nombre: T-800
    alias: [t800, t-800, terminator, terminador]
    cuerpo: ws://127.0.0.1:8772
    cuerpo_desc: "pixel-art T-800: half human face, half metal endoskeleton, dark sunglasses with a cracked lens and a glowing red eye, leather jacket"
    mirar: [camara, chat, izquierda, derecha, arriba, abajo]
    idioma: es
    # gTTS solo tiene voz de mujer: tono grave + formantes corridos = voz de hombre robótica (CPU, sin VRAM)
    voz: {motor: google, respaldo: ninguno, gtts_tld: {es: com.mx, en: com}, tono: 0.72, formantes: correr}

sala:
  activo: true           # anfitrión: en los silencios abre un tema de la lista, piensa en voz alta o le pregunta al chat
  silencio: [100, 200]  # modo juego: un comentario cada ~2-3 min
  dialogo_max: 1
  replicar: 0
  posturas: {}

canal:
  youtube: "@barbieblackrose"
  twitch: ""
  kick: "barbieblackrose"
  auto: true
  cada: [20, 45]
  vence: 180
  ignorar: [Nightbot, StreamElements, Streamlabs, Moobot]
  bloquear: []

# solo para el desplegable "Conversar de esto" de la consola: los bloques del guion, los abre ella
temas_guion:
  - "Noticias de tecnología e IA de esta semana, y memes"
  - "La temporada nueva de Fast Penguin, que empezó hoy: primeras impresiones"
  - "Repositorios raros e interesantes de GitHub"
  - "REA"
  - "GoldenEye 007 recompilado desde el código decompilado: cómo se hizo y cómo corre"
  - "Unity: lo que estamos dibujando y armando en Yamu Vania"

temas:
  - "Alice está jugando la temporada nueva de Fast Penguin: dale ánimo o un comentario corto como compañero de sofá"
  - "pingüinos: un dato curioso real sobre pingüinos, contado como robot que los estudia"
  - "por qué a los humanos les gusta perder en un juego y volver a intentarlo"
  - "qué haría un T-800 si tuviera que jugar Fast Penguin: su estrategia, con humor"
  - "pregúntale al chat (no a ella) qué juego les gustaría verla jugar en el próximo stream"
  - "juegos de madrugada: jugar a las 3 AM con café"
  - "speedruns: por qué los humanos intentan terminar las cosas cada vez más rápido"

# ./dolls.sh start --t800 --ligero: cerebro = Claude Code (haiku) por el shim :8086, sin 4B. El cuerpo ya es liviano.
perfiles:
  ligero:
    llm_directo: http://127.0.0.1:8086
